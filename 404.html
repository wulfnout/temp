<body>

<style>
/* Layout: card feed on a toned ground — wordmark header, morphing story orbs, rounded post cards, full-screen Replay, settings as stacked grouped lists, solid bottom bar */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#eeedeb; --card:#ffffff; --soft:#f4f3f1; --ink:#0a0a0a; --muted:#7c7671; --line:#e2dfdb;
  --orange:#ff5500; --orange-2:#ff8a2b; --on-orange:#ffffff; --orange-soft:#ffeadf; --scrim:rgba(10,10,10,.14); --ok:#22c55e;
  --display:"Unbounded",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#111111; --soft:#1c1c1c; --ink:#ffffff; --muted:#8d8883; --line:#252525;
  --orange:#ff5c0a; --orange-2:#ff8f33; --on-orange:#ffffff; --orange-soft:#2a1206; --scrim:rgba(0,0,0,.28); --ok:#22c55e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111111; --soft:#1c1c1c; --ink:#ffffff; --muted:#8d8883; --line:#252525;
  --orange:#ff5c0a; --orange-2:#ff8f33; --on-orange:#ffffff; --orange-soft:#2a1206; --scrim:rgba(0,0,0,.28); --ok:#22c55e; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink)}
img,video{max-width:100%;display:block}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;transition:transform .22s ease}
.nav{transition:transform .22s ease}
.bars-off .top{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.bars-off .nav{transform:translateY(100%)}
.top-row{display:flex;align-items:center;gap:10px;height:44px}
.logo{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.04em;line-height:1;margin:0;display:flex;align-items:flex-end;gap:3px}
.logo-btn{all:unset;cursor:pointer;display:flex;align-items:flex-end;gap:3px;font:inherit;color:inherit}
.logo i{width:9px;height:9px;background:var(--orange);display:inline-block;border-radius:2px;margin-bottom:3px}
.top-title{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:6px;margin-left:auto}
.circle{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.seg{display:flex;background:var(--card);--r:15px;border-radius:var(--r);padding:4px;margin-top:10px;gap:2px;touch-action:pan-y;user-select:none;-webkit-user-select:none;animation:squish 9s ease-in-out -8s infinite}
.seg button{flex:1;padding:9px 4px;--r:15px;border-radius:var(--r);font-weight:700;font-size:14px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap;animation:squish 11s ease-in-out -7s infinite}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;--r:9px;border-radius:var(--r);background:var(--orange);color:var(--on-orange);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:squish 8s ease-in-out -6s infinite}
.dot-badge{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:3px;background:var(--orange);box-shadow:0 0 0 2px var(--card)}

/* morphing story orbs */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.stories::-webkit-scrollbar{display:none}
.story{display:grid;justify-items:center;gap:7px;flex:none;width:76px}
.story > span{font-size:12px;font-weight:600;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.orb{width:74px;height:74px;padding:3px;position:relative;display:block;
  background:conic-gradient(from var(--spin),var(--orange),var(--orange-2),#ffd27a,var(--orange-2),var(--orange));
  animation:morph 7s ease-in-out infinite,spin 3.5s linear infinite;border-radius:60% 40% 55% 45%/50% 60% 40% 50%}
.orb.seen{background:var(--line);animation:morph 11s ease-in-out infinite}
.orb > .av{width:100%;height:100%;border-radius:inherit;border:3px solid var(--bg)}
.orb .add{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:8px;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;border:3px solid var(--bg)}
.story:nth-child(2n) .orb{animation-delay:-2s,-1s}.story:nth-child(3n) .orb{animation-delay:-4s,-2s}.story:nth-child(5n) .orb{animation-duration:9s,4.5s}

.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:var(--ink);position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;display:inline-block;flex:none}
.online{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card)}
.verified{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;background:var(--orange);color:#fff;vertical-align:-2px;margin-left:4px;flex:none}

/* post */
.feed{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.post{background:var(--card);border-radius:26px;padding:14px;position:relative;overflow:hidden;
  transition:opacity .7s ease,filter .7s ease,transform .7s ease,max-height .7s ease .1s,padding .7s ease .1s,margin .7s ease .1s;max-height:2000px}
.post.gone{opacity:0;filter:blur(8px);transform:scale(.96);max-height:0;padding-block:0;margin-top:-10px}
.p-head{display:flex;align-items:center;gap:10px;min-width:0}
.p-id{min-width:0;display:flex;flex-direction:column;line-height:1.2;text-align:left}
.p-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.p-sub{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-right{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.p-more{color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.p-more:hover{background:var(--soft);color:var(--ink)}
.p-text{margin:12px 2px 0;font-size:16.5px;line-height:1.38;overflow-wrap:anywhere;white-space:pre-wrap;font-weight:500}
.p-text.big{font-family:var(--display);font-size:19px;line-height:1.28;font-weight:700;letter-spacing:-.03em}
.tag{color:var(--orange);font-weight:700}
.media{margin-top:12px;border-radius:20px;overflow:hidden;position:relative;background:var(--soft);user-select:none}
.media img,.media video{width:100%;max-height:600px;object-fit:cover}
.gif-tag{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;letter-spacing:.04em}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--orange);z-index:3}
.burst svg{animation:burst .9s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(0 6px 24px rgba(255,85,0,.6))}
.timer{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;padding:6px 10px;--r:15px;border-radius:var(--r);font-variant-numeric:tabular-nums;animation:squish 10s ease-in-out -5s infinite}
.timer.burning{background:var(--orange);color:var(--on-orange)}
.timer.frozen{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.timer.frozen{background:var(--ink);color:var(--bg);box-shadow:none}
.post.is-frozen .p-head .av,.post.is-frozen .p-id,.post.is-frozen .cover-wrap,.post.is-frozen .p-comments{filter:grayscale(1);opacity:.45}
.post.is-frozen{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.ic:disabled{opacity:.3;cursor:not-allowed}
.reel.is-frozen canvas,.reel.is-frozen video,.reel.is-frozen .reel-info{filter:grayscale(1);opacity:.55}
.rail-btn:disabled{opacity:.35;cursor:not-allowed}
.life{position:absolute;left:0;bottom:0;height:3px;transition:width .25s linear}
.life.burning{background:var(--orange)}
.lifebar{display:flex;align-items:center;margin-top:12px;position:relative}
/* greyed-out trail: the full path the orb has travelled, with a faint imprint where it started */
.lifebar::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--line)}
.lifebar::after{content:"";position:absolute;right:0;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:54% 46% 56% 44%/48% 55% 45% 52%;background:var(--line)}
.lifebar>*{position:relative;z-index:1}.lifebar i{height:3px;border-radius:2px;background:var(--orange);transition:flex .25s linear}
.lifebar span.orb{position:relative;width:35px;height:35px;padding:0;justify-content:center;gap:1px;background:none;border-radius:0;margin-left:-2px;text-shadow:none}
.lifebar span.orb>em{position:absolute;inset:0;z-index:0;border-radius:52% 44% 56% 42%/46% 55% 45% 54%;background:var(--orange);animation:morph 9s ease-in-out infinite,blob 5.6s ease-in-out infinite,orbspin 14s linear infinite}
@keyframes orbspin{to{rotate:360deg}}
@keyframes orbflow{0%,100%{border-radius:52% 44% 56% 42%/46% 55% 45% 54%}25%,75%{border-radius:50%}50%{border-radius:42% 56% 44% 54%/55% 45% 54% 46%}}
.lifebar span.orb>svg,.lifebar span.orb>b{position:relative;z-index:1}
.lifebar span.orb>b{font-family:var(--display);font-weight:800;font-size:8.5px;letter-spacing:-.04em}
@keyframes orbtick{0.000%{transform:rotate(0deg)}3.500%{transform:rotate(30deg)}8.333%{transform:rotate(30deg)}11.833%{transform:rotate(60deg)}16.667%{transform:rotate(60deg)}20.167%{transform:rotate(90deg)}25.000%{transform:rotate(90deg)}28.500%{transform:rotate(120deg)}33.333%{transform:rotate(120deg)}36.833%{transform:rotate(150deg)}41.667%{transform:rotate(150deg)}45.167%{transform:rotate(180deg)}50.000%{transform:rotate(180deg)}53.500%{transform:rotate(210deg)}58.333%{transform:rotate(210deg)}61.833%{transform:rotate(240deg)}66.667%{transform:rotate(240deg)}70.167%{transform:rotate(270deg)}75.000%{transform:rotate(270deg)}78.500%{transform:rotate(300deg)}83.333%{transform:rotate(300deg)}86.833%{transform:rotate(330deg)}91.667%{transform:rotate(330deg)}95.167%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
.lifebar span{display:inline-flex;align-items:center;gap:2px;background:var(--orange);color:#fff;--r:8px;border-radius:var(--r);padding:1px 6px;font-size:9.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap} .life.frozen{background:var(--ink)}
.p-actions{display:flex;align-items:center;gap:6px;margin-top:12px}
.react{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;--r:15px;border-radius:var(--r);background:var(--soft);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .15s;animation:squish 9s ease-in-out -3s infinite}
.react:active{transform:scale(.94)}
.react.heat.on{background:var(--orange);color:var(--on-orange)}
.react.freeze.on{background:var(--ink);color:var(--bg)}
.react.on svg{animation:pop .4s ease}
.social{margin-left:auto;display:flex;gap:0}
.ic{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 8px;--r:15px;border-radius:var(--r);font-weight:700;font-size:14px;color:var(--ink);animation:squish 11s ease-in-out -2s infinite}
.ic:hover{background:var(--soft)}
.ic .n{color:var(--muted)}
.ic.on{color:var(--orange)}
.p-comments{font-size:14px;color:var(--muted);margin:10px 2px 0;text-align:left;display:block;font-weight:500;overflow-wrap:anywhere}
.p-comments b{color:var(--ink);font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav button{width:56px;height:46px;display:grid;place-items:center;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:2px;background:var(--orange)}
.nav .create{width:54px;height:44px;--r:15px;border-radius:var(--r);background:var(--orange);color:var(--on-orange);animation:squish 8s ease-in-out -1s infinite}
.nav.dark{background:#000;border-color:#1c1c1c}
.nav.dark button{color:#8d8883}.nav.dark button[aria-current="page"]{color:#fff}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .34s cubic-bezier(.16,1,.3,1);box-shadow:0 -6px 24px rgba(0,0,0,.25)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 0 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h3{margin:0}
:root{--orb:conic-gradient(from 210deg at 38% 55%,#ee5f1f,#f58a3d 30%,#ffb36b 48%,#f7924a 66%,#ee5f1f)}
.btn{background:var(--ink);color:var(--bg);--r:15px;border-radius:var(--r);padding:11px 20px;font-weight:800;font-size:14px;white-space:nowrap;animation:squish 10s ease-in-out 0s infinite}
.btn.orange{background:var(--orb);color:#fff;text-shadow:0 1px 2px rgba(140,40,0,.35)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.wide{width:100%;padding:16px;font-size:16px}
.row{display:flex;align-items:center;gap:12px;padding-block:9px}
.row .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px;font-weight:500}
.menu{background:var(--soft);--r:20px;border-radius:var(--r);overflow:hidden;animation:squish 7s ease-in-out -8s infinite}
.menu-item{width:100%;text-align:left;padding:16px;font-weight:700;display:flex;gap:12px;align-items:center}
.menu-item + .menu-item{border-top:1px solid var(--line)}
.menu-item.warn{color:var(--orange)}

.compose{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px}
.compose textarea{width:100%;border:0;resize:none;background:transparent;font-size:19px;font-weight:500;min-height:110px;padding-top:9px}
.compose textarea::placeholder{color:var(--muted)}
.c-preview{position:relative;margin-top:6px}
.c-remove{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;z-index:2}
.c-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.c-tools{display:flex;gap:6px;flex-wrap:wrap}
.c-tools button{height:40px;padding:0 14px;--r:15px;border-radius:var(--r);background:var(--soft);display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;animation:squish 9s ease-in-out -7s infinite}
.count{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.count.over{color:var(--orange)}
.mode{display:flex;gap:4px;background:var(--soft);--r:8px;border-radius:var(--r);padding:3px;animation:squish 11s ease-in-out -6s infinite}
.mode button{padding:7px 14px;--r:15px;border-radius:var(--r);font-weight:800;font-size:13px;color:var(--muted);animation:squish 8s ease-in-out -5s infinite}
.mode button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

.comment{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding-block:9px;align-items:start}
.comment p{margin:2px 0 0;overflow-wrap:anywhere}
.c-meta{display:flex;gap:14px;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:700}
.c-like{display:grid;justify-items:center;gap:1px;color:var(--muted);font-size:11.5px;font-weight:700;padding-top:4px;min-width:28px}
.c-like.on{color:var(--orange)}
.c-like.on svg{animation:pop .35s ease}
.inputbar{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--soft);--r:15px;border-radius:var(--r);padding:4px 4px 4px 16px;animation:squish 10s ease-in-out -4s infinite}
.inputbar input{flex:1;border:0;background:transparent;padding:10px 0;min-width:0;font-weight:500}
.inputbar input:focus-visible{outline:none}
.inputbar:focus-within{box-shadow:inset 0 0 0 2px var(--orange)}
.send{width:40px;height:40px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.3}

/* profile */
.prof{background:var(--card);border-radius:0 0 30px 30px;overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:18px}
.header-img{height:180px;background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 40%,#0a0a0a 100%);overflow:hidden;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.header-img img{width:100%;height:100%;object-fit:cover}
.header-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.orbs3{display:flex;gap:4px}.orbs3 i{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}

.prof-top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-48px;gap:8px}

.prof-name{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.04em;margin:12px 0 2px;line-height:1.05;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prof-bio{margin:10px 0 0;font-weight:500}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--soft);--r:16px;border-radius:var(--r);padding:10px 14px;display:grid;min-width:76px;text-align:left;animation:squish 7s ease-in-out -3s infinite}
.stat b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px;--r:20px;border-radius:var(--r);overflow:hidden;animation:squish 9s ease-in-out -2s infinite}
.grid3 button{aspect-ratio:1;background:var(--card);position:relative;overflow:hidden;max-width:100%}
.grid3 button.tall{aspect-ratio:9/16}
.grid3 img{width:100%;height:100%;object-fit:cover}
.grid3 .txt{position:absolute;inset:0;padding:10px;font-weight:700;font-size:12.5px;text-align:left;overflow:hidden;line-height:1.25}
.grid3 .rp{position:absolute;left:8px;bottom:8px;color:#fff;font-weight:800;font-size:12px;display:flex;gap:4px;align-items:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.edit-header{position:relative;height:130px;--r:22px;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 40%,#0a0a0a 100%);animation:squish 11s ease-in-out -1s infinite}
.edit-header img{width:100%;height:100%;object-fit:cover}
.overlay-btn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3);color:#fff;font-weight:700}
.edit-av{position:relative;margin-top:-36px;margin-left:14px;width:82px;height:82px}

.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:0;--r:16px;border-radius:var(--r);padding:14px 16px;background:var(--card);width:100%;font-weight:500;animation:squish 8s ease-in-out 0s infinite}
.sheet .field input,.sheet .field textarea{background:var(--soft)}
.field textarea{resize:vertical;min-height:76px}

/* settings */
.set-group{background:var(--card);--r:24px;border-radius:var(--r);overflow:hidden;margin-top:12px;animation:squish 11s ease-in-out -8s infinite}
.set-label{font-family:var(--display);font-size:12.5px;font-weight:700;margin:22px 6px 0;letter-spacing:-.01em}
.set-item{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-weight:700;min-height:56px}
.set-item + .set-item{border-top:1px solid var(--line)}
.set-item .si{width:34px;height:34px;--r:11px;border-radius:var(--r);background:var(--soft);display:grid;place-items:center;flex:none;animation:squish 10s ease-in-out -8s infinite}
.set-item .grow{flex:1;min-width:0}
.set-item .val{color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.set-item.warn{color:var(--orange)}
.set-item .chev{color:var(--muted)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--orange)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.radio.on{box-shadow:inset 0 0 0 7px var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);--r:15px;border-radius:var(--r);padding:7px 8px 7px 13px;font-weight:700;font-size:14px;animation:squish 7s ease-in-out -7s infinite}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);--r:15px;border-radius:var(--r);padding:0 16px;height:46px;flex:1;animation:squish 9s ease-in-out -6s infinite}
.search input{border:0;background:transparent;flex:1;min-width:0;font-weight:600}
.search input:focus-visible{outline:none}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--orange)}
.trends{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.trend{background:var(--card);--r:15px;border-radius:var(--r);padding:9px 14px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:baseline;animation:squish 11s ease-in-out -5s infinite}
.trend span{color:var(--muted);font-weight:600;font-size:12px}

/* lists */
.list-card{background:var(--card);--r:26px;border-radius:var(--r);padding:6px 14px;margin-top:8px;animation:squish 13s ease-in-out -7s infinite}
.thread-row{display:flex;gap:12px;align-items:center;padding-block:10px;width:100%;text-align:left}
.thread-row + .thread-row{border-top:1px solid var(--line)}
.thread-row .grow{flex:1;min-width:0}
.thread-row b{font-weight:800}
.thread-row .last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.notif.unread{background:linear-gradient(90deg,var(--orange-soft,transparent),transparent)}
.n-ico{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.section-label{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:-.01em;margin:20px 4px 4px}

.msgs{display:flex;flex-direction:column;gap:4px;padding-block:14px}
.msg{max-width:78%;padding:10px 15px;--r:22px;border-radius:var(--r);background:var(--card);align-self:flex-start;overflow-wrap:anywhere;font-weight:500;position:relative;user-select:none;animation:squish 8s ease-in-out -4s infinite}
.msg.mine{align-self:flex-end;background:var(--orange);color:var(--on-orange)}
.msg.big{background:transparent!important;font-size:40px;padding:0 4px}
.msg-react{position:absolute;bottom:-12px;right:8px;background:var(--card);--r:8px;border-radius:var(--r);padding:1px 5px;font-size:13px;box-shadow:0 0 0 2px var(--bg);animation:squish 10s ease-in-out -3s infinite}
.msg.mine .msg-react{right:auto;left:8px}
.msg.has-react{margin-bottom:12px}
.msg-note{font-size:12px;color:var(--muted);font-weight:600;margin:2px 6px}
.msg-note.mine{align-self:flex-end}
.seen{align-self:flex-end;font-size:12px;color:var(--muted);font-weight:700;margin:2px 6px}
.typing{align-self:flex-start;background:var(--card);--r:22px;border-radius:var(--r);padding:13px 16px;display:flex;gap:4px;animation:squish 7s ease-in-out -2s infinite}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.shared{--r:22px;border-radius:var(--r);overflow:hidden;background:var(--card);color:var(--ink);width:min(78%,300px);align-self:flex-end;display:grid;animation:squish 9s ease-in-out -1s infinite}
.shared.theirs{align-self:flex-start}
.shared img,.shared video{max-height:200px;object-fit:cover;width:100%}
.shared .sh-body{padding:10px 14px;display:grid;gap:4px;font-weight:500}
.shared .sh-by{font-size:12px;color:var(--muted);font-weight:800}
.dm-input{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:var(--bg);padding:8px max(16px,env(safe-area-inset-left,0px));max-height:70dvh;overflow:auto}
.bars-off .dm-input{bottom:env(safe-area-inset-bottom,0px)}
.msgs{padding-bottom:84px}
.dm-input .inputbar{background:var(--card)}

/* story viewer */
.sv{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;justify-content:center;animation:fade .2s ease}
.sv-in{position:relative;width:100%;max-width:480px;height:100%}
.sv-media{position:absolute;inset:0;display:grid;place-items:center}
.sv-media img,.sv-media video{width:100%;height:100%;object-fit:cover}
.sv-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:4px;z-index:2}
.sv-bars div{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.sv-bars span{display:block;height:100%;background:#fff}
.sv-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;z-index:3;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.sv-btns{margin-left:auto;display:flex}
.sv-close{width:38px;height:38px;display:grid;place-items:center;color:#fff}
.sv-touch{position:absolute;left:0;right:0;top:70px;bottom:120px;z-index:1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sv-count{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;font-family:var(--display);font-weight:800;font-size:96px;color:#000;text-shadow:0 0 18px rgba(255,255,255,.85)}

.sv-foot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:grid;gap:10px}
.sv-reacts{display:flex;justify-content:space-around}

.sv-input{display:flex;gap:8px;align-items:center;border:1.5px solid rgba(255,255,255,.55);border-radius:15px;padding:4px 4px 4px 16px}
.sv-input input{flex:1;background:transparent;border:0;color:#fff;padding:9px 0;min-width:0}
.sv-input input::placeholder{color:rgba(255,255,255,.7)}
.sv-input input:focus-visible{outline:none}

/* replay */
.reels{position:fixed;left:0;right:0;top:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:25;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center;color:#fff}
.reel-in{position:relative;height:100%;width:auto;aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#0a0a0a}
.reel canvas,.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 60%,rgba(0,0,0,.7));pointer-events:none}
.reel-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;z-index:3}

.replays{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);padding:6px 11px;--r:15px;border-radius:var(--r);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;animation:squish 11s ease-in-out 0s infinite}
.reel-info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:84px;bottom:22px;z-index:3;display:grid;gap:10px}
.reel-who{display:flex;align-items:center;gap:10px;font-weight:800}

.reel-cap{font-weight:600;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.5);overflow-wrap:anywhere}
.reel-rail{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:22px;z-index:3;display:grid;gap:14px;justify-items:center}
.rail-btn{display:grid;justify-items:center;gap:3px;font-weight:800;font-size:12.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rail-btn .rb{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rail-btn.on .rb{background:var(--orange)}
.rail-btn.rp.on .rb{background:#22c55e}
.rail-btn:disabled{opacity:.35}
.rail-btn.ice.on .rb{background:#fff;color:#000}
.reel-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:3}
.reel-prog div{height:100%;background:var(--orange)}
.reel-pause{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.reel-pause span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;animation:fade .2s ease}
.reel-timer{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:3}

/* welcome */
.welcome{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.welcome-in{width:100%;max-width:400px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:100%}
.w-hero{display:grid;gap:18px;padding-top:6vh}
.w-mark{font-family:var(--display);font-weight:800;font-size:clamp(68px,22vw,104px);letter-spacing:-.06em;line-height:.85;margin:0;display:flex;align-items:flex-end;gap:6px}

.w-form{display:grid;gap:2px}
.pw{display:flex;align-items:center;background:var(--card);--r:16px;border-radius:var(--r);animation:squish 8s ease-in-out -8s infinite}
.pw input{flex:1;min-width:0;background:transparent!important}
.pw button{padding:0 16px;font-weight:800;font-size:13px;color:var(--muted);align-self:stretch}
.a-link{color:var(--orange);font-weight:800;font-size:14px;justify-self:end;margin-top:10px}
.a-err{color:var(--orange);font-weight:700;font-size:14px;margin:12px 4px 0}
.a-note{color:var(--ink);font-weight:600;font-size:14px;margin:12px 4px 0;background:var(--card);padding:12px 14px;--r:14px;border-radius:var(--r);animation:squish 10s ease-in-out -7s infinite}
.field input[type=date]{min-height:50px}

/* tour */
.tour{position:fixed;inset:0;z-index:100;pointer-events:none}
.tour-dim,.tour-card{pointer-events:auto}
.tour-dim{position:fixed;background:rgba(0,0,0,.52);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tour-ring{position:fixed;box-shadow:0 0 0 3px var(--orange),0 0 0 9px rgba(255,85,0,.22);pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1);animation:ring 1.6s ease-in-out infinite}
.tour-card{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--card);color:var(--ink);--r:26px;border-radius:var(--r);padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  transition:top .35s cubic-bezier(.2,.9,.3,1),left .35s cubic-bezier(.2,.9,.3,1);animation:up .3s ease,squish 10s ease-in-out -6s infinite}
.tour-card.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%);animation:none}
.t-step{font-size:12px;color:var(--orange);font-weight:800;font-variant-numeric:tabular-nums}
.t-title{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.03em;margin:6px 0 6px;line-height:1.15;text-wrap:balance}
.t-body{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.t-try{margin-top:12px;font-weight:800;font-size:14px;color:var(--on-orange);background:var(--orange);padding:10px 14px;--r:16px;border-radius:var(--r);animation:squish 7s ease-in-out -6s infinite}
.t-try.done{color:var(--ink);background:var(--soft)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.t-skip{color:var(--muted);font-size:14px;font-weight:700}
.t-dots{display:flex;gap:4px;margin-top:14px}
.t-dots span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.t-dots span.on{background:var(--orange)}

.modal{position:fixed;inset:0;z-index:95;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .2s ease}
.modal-card{background:var(--card);--r:28px;border-radius:var(--r);padding:24px;width:min(360px,100%);text-align:center;display:grid;gap:12px;justify-items:center;animation:squish 12s ease-in-out -5s infinite}
.modal-card h3{font-family:var(--display);font-size:22px;letter-spacing:-.03em;margin:0}
.empty{padding:56px 16px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;--r:15px;border-radius:var(--r);font-weight:800;font-size:14px;z-index:99;max-width:calc(100% - 32px);animation:toast 2.2s ease forwards,squish 9s ease-in-out -5s infinite;text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.plus-badge{display:inline-grid;place-items:center;height:16px;min-width:16px;padding:0 4px;border-radius:5px;background:var(--ink);color:var(--orange);font-family:var(--display);font-size:11px;font-weight:800;margin-left:4px;vertical-align:-2px;line-height:1}
.views{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 6px;color:var(--muted);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.nsfw{font-weight:800;font-size:11px;padding:4px 7px;border-radius:7px;background:var(--ink);color:var(--bg);margin-right:4px}
.cover-wrap{position:relative}
.covered{filter:blur(10px);user-select:none;pointer-events:none}
.cover-btn{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-weight:800;font-size:13.5px}
.cover-btn span{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:15px}
.mod-err{color:var(--orange);font-weight:700;font-size:13.5px;margin:10px 2px 0}
.mod-err button{color:var(--ink);text-decoration:underline;font-weight:800}
.sticker{font-size:58px;line-height:1.05;display:inline-block;transform:rotate(-5deg);filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.msg.stk{background:transparent!important;padding:4px 6px}
.picker{display:flex;gap:2px;flex-wrap:wrap;background:var(--soft);--r:18px;border-radius:var(--r);padding:8px;margin-top:8px;max-height:200px;overflow:auto;animation:squish 11s ease-in-out -4s infinite}
.picker .pk{width:100%;font-size:11.5px;font-weight:800;color:var(--muted);padding:4px 6px 0}

/* Blackout (free): every accent turns black — or white when the phone is in dark mode — logo included */

@media (prefers-color-scheme:dark){html.blackout:not([data-theme="light"]){--orange:#fff;--orange-2:#cfcfcf;--on-orange:#000;--orb:#fff}}

html.blackout .btn.orange{color:var(--on-orange);text-shadow:none}
html.blackout .verified,html.blackout .lifebar span,html.blackout .n-ico,html.blackout .seg .cnt,html.blackout .off,html.blackout .ed-ok,html.blackout .tool-rec,html.blackout .voice.mine,html.blackout .live-mic.on{color:var(--on-orange)!important}

/* Live Takes */
.live-lobby{padding-block:6px 20px}
.live-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#1a0700,#3a1204 60%,#ff5500);color:#fff;--r:26px;border-radius:var(--r);padding:20px;animation:squish 12s ease-in-out 0s infinite}
.live-hero h2{margin:0;font-family:var(--display);font-size:26px;letter-spacing:-.04em}.live-hero p{margin:4px 0 0;opacity:.8;font-weight:600}
.live-hero .btn{display:inline-flex;gap:6px;align-items:center}
.live-make{background:var(--card);--r:22px;border-radius:var(--r);padding:14px;margin-top:12px;display:grid;gap:10px;animation:squish 7s ease-in-out 0s infinite}
.live-make input{background:var(--soft);border:0;--r:14px;border-radius:var(--r);padding:12px 14px;color:var(--ink);font-size:16px;font-weight:600;animation:squish 9s ease-in-out -8s infinite}
.live-make-row{display:flex;gap:8px;justify-content:flex-end}
.live-h{font-family:var(--display);font-size:15px;margin:22px 4px 10px}
.live-card{display:grid;gap:8px;text-align:left;width:100%;background:var(--card);--r:22px;border-radius:var(--r);padding:16px;margin-bottom:10px;animation:squish 11s ease-in-out -7s infinite}
.live-dot{justify-self:start;background:#ff2d2d;color:#fff;font-weight:900;font-size:10.5px;letter-spacing:.08em;padding:3px 8px;border-radius:15px;animation:tick 1.6s ease-in-out infinite}
.live-title{font-family:var(--display);font-size:18px;letter-spacing:-.03em}
.live-people{display:flex}.live-people>*{margin-right:-8px;border:2px solid var(--card);border-radius:50%}
.live-room{padding-block:6px 120px;position:relative}
.live-room-head{display:grid;gap:8px;margin:4px 0 14px}.live-room-head h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.04em}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px}.live-grid.small{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.live-p{display:grid;justify-items:center;gap:3px;text-align:center;min-width:0}.live-p b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-av{position:relative;border-radius:50%;padding:3px;transition:box-shadow .1s}
.live-av.talking{box-shadow:0 0 0 calc(3px + var(--lv)*5px) var(--rc),0 0 calc(12px + var(--lv)*22px) var(--rc)}
.live-mute,.live-hand{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:13px}
.live-hand{left:-2px;right:auto;top:-2px;bottom:auto}
.live-ctl{display:grid;gap:4px;margin-top:4px}.live-ctl button{font-size:11.5px;font-weight:800;color:var(--orange)}
.live-bar{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);z-index:30}
.embed .live-bar{bottom:env(safe-area-inset-bottom,0px)}
.live-reacts{flex:1;display:flex;justify-content:center;gap:4px}.live-reacts button{font-size:24px;width:42px;height:42px;border-radius:50%;background:var(--card)}
.live-mic{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px}.live-mic.on{background:var(--orange);color:#fff}
.live-floaters{position:fixed;left:0;right:0;bottom:130px;height:0;pointer-events:none;max-width:560px;margin:0 auto;z-index:31}
.live-floaters span{position:absolute;bottom:0;font-size:30px;animation:floatUp 2.6s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{opacity:0;transform:translateY(-260px) scale(1)}}
.app.embed{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.c-pending{display:flex;align-items:flex-end;gap:8px;margin-top:10px}.c-pending img{width:120px;height:90px;object-fit:cover;border-radius:14px;background:var(--soft)}
.c-pending button{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.fire-licks{position:absolute;inset:0;z-index:-1;pointer-events:none}
.fire-licks i{position:absolute;display:block;transform:rotate(var(--a));mix-blend-mode:screen}
.fire-licks b{position:absolute;inset:0;display:block;border-radius:50% 50% 50% 50%/88% 88% 12% 12%;transform-origin:50% 100%;
  background:radial-gradient(ellipse 50% 80% at 50% 92%,#fff6d6 0%,#ffd27a 25%,#ff8a2b 50%,rgba(255,60,0,.85) 72%,rgba(220,30,0,0) 100%);
  filter:blur(.4px);opacity:0;animation:tongue var(--t) cubic-bezier(.3,.2,.6,1) infinite;animation-delay:var(--d)}
.fire-licks i:not(.hot) b{background:radial-gradient(ellipse 50% 80% at 50% 92%,#ffb347 0%,#ff4a0a 35%,rgba(220,30,0,.85) 65%,rgba(150,10,0,0) 100%);filter:blur(.7px)}
@keyframes tongue{0%{opacity:0;transform:translateY(25%) scale(.5,.35) skewX(0)}18%{opacity:1}55%{opacity:.95;transform:translateY(-8%) scale(1,1) skewX(var(--sw))}100%{opacity:0;transform:translateY(-42%) scale(.35,.75) skewX(calc(var(--sw)*-2))}}
.prof-orb{width:104px;height:104px;border:4px solid var(--card);box-sizing:content-box}
.n-name{font-weight:800;font-size:inherit;color:inherit;padding:0;display:inline}
.sv-burn{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);color:#fff;border-radius:15px;padding:5px 9px;font-weight:800;font-size:12px;align-self:center}
.vt-area{position:absolute;inset:0;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fullv-box .vt-area{touch-action:none}
.vt-fast{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.55);color:#fff;--r:15px;border-radius:var(--r);padding:6px 12px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:2px;pointer-events:none;animation:squish 8s ease-in-out -6s infinite}
.vt-seek{position:absolute;top:0;bottom:0;width:33%;z-index:4;display:grid;place-items:center;background:rgba(255,255,255,.08);pointer-events:none;animation:fade .15s}
.vt-seek.L{left:0;border-radius:0 999px 999px 0}.vt-seek.R{right:0;--r:15px;border-radius:var(--r) 0 0 999px;animation:squish 10s ease-in-out -5s infinite}
.vt-seek b{background:rgba(0,0,0,.55);color:#fff;--r:15px;border-radius:var(--r);padding:6px 12px;font-size:13px;animation:squish 7s ease-in-out -4s infinite}
.fv{position:relative;background:#000;aspect-ratio:16/9;cursor:pointer}.fv video{width:100%;height:100%;max-height:none!important;object-fit:contain!important;display:block}
.fullv{position:fixed;inset:0;z-index:150;background:#000;cursor:default;--ph:0px;transition:opacity .2s}
.fullv.p1{--ph:calc(170px + env(safe-area-inset-bottom,0px))}.fullv.p2{--ph:62dvh}
.fullv-box{transition:height .24s ease,top .24s ease}
.fullv.p1 .fullv-box,.fullv.p2 .fullv-box{top:calc((100dvh - var(--ph)) / 2);height:calc(100dvh - var(--ph))}
.fullv-panel{position:absolute;left:0;right:0;bottom:0;height:var(--ph);z-index:5;background:#111;color:#fff;border-radius:24px 24px 0 0;padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;animation:sheetUp .24s cubic-bezier(.16,1,.3,1)}
.fp-grab{align-self:stretch;padding:10px;display:grid;place-items:center}.fp-grab i{width:38px;height:5px;border-radius:3px;background:#333}
.fp-head{display:flex;gap:10px;align-items:center}.fp-head>div{flex:1;min-width:0}.fp-head p{margin:2px 0 0;font-size:14px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fp-stat{display:inline-flex;gap:4px;align-items:center;font-weight:800;font-size:13px;color:#fff}
.fp-list{flex:1;overflow:auto;margin-top:10px}.fp-c{display:flex;gap:8px;padding:6px 0}.fp-c p{margin:2px 0 0;font-size:14px}.fp-c span{color:#8d8883;font-size:12px}.fp-empty{color:#8d8883;text-align:center;margin-top:20px}
.fp-input{margin-top:auto;display:flex;align-items:center;background:#1c1c1c;--r:15px;border-radius:var(--r);padding:4px 4px 4px 14px;animation:squish 9s ease-in-out -3s infinite}.fp-input input{flex:1;background:none;border:0;color:#fff;font-size:16px;padding:8px 0;outline:none}
.fp-input button{width:34px;height:34px;border-radius:50%;background:#ff5500;color:#fff;display:grid;place-items:center}
.fp-hint{position:absolute;bottom:calc(4px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:22px;z-index:3;pointer-events:none}
.fullv-box{position:absolute;left:50%;top:50%;width:100vw;height:100dvh;transform:translate(-50%,-50%)}
.fullv-box.land{width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
.fullv-box video{width:100%;height:100%;object-fit:contain}
.fullv-ui{position:absolute;inset:0;pointer-events:none;z-index:3}.fullv-ui>*{pointer-events:auto}
.fullv-top{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between}
.fullv-top button,.fullv-bar button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.fullv-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.fullv-bar{position:absolute;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums}
.fullv-bar input{flex:1;accent-color:#ff5500}
.fv-time{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;--r:8px;border-radius:var(--r);padding:3px 8px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.fv-btns{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}.fv-btns button{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.fv-big{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;pointer-events:none}
/* intro + ash */
.intro{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;pointer-events:none;animation:introOut .4s ease 3.45s forwards}
.intro-glow{position:absolute;width:420px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,85,0,.35),rgba(255,45,0,.12) 55%,transparent);opacity:0;filter:blur(8px);animation:iglow 2.6s ease 0.9s forwards}
@keyframes iglow{20%{opacity:1;transform:scale(1.05)}60%{opacity:.8}100%{opacity:0;transform:scale(1.25)}}
.il{position:relative;display:inline-block}
.il .ch{display:inline-block;color:#fff;opacity:0;transform:translateY(10px);
  animation:iin .6s cubic-bezier(.2,.9,.3,1) var(--in) forwards,iheat .45s ease-in var(--b) forwards,ichar .18s linear calc(var(--c) - .16s) forwards,icrumble .6s ease-in var(--c) forwards}
.il .ch.dot{width:17px;height:17px;border-radius:4px;margin:0 0 9px 5px;background:#ff5500;
  animation:iin .6s cubic-bezier(.2,.9,.3,1) var(--in) forwards,dheat .45s ease-in var(--b) forwards,dchar .18s linear calc(var(--c) - .16s) forwards,dcrumble .6s ease-in var(--c) forwards}
@keyframes iin{to{opacity:1;transform:none}}
@keyframes iheat{0%{color:#fff;text-shadow:none}50%{color:#ffe7b0;text-shadow:0 0 6px #ffd27a,0 0 18px #ff8a2b,0 0 36px #ff5500}100%{color:#ff7a1a;text-shadow:0 0 8px #ff5500,0 0 26px #ff2d00,0 0 54px #ff2d00}}
@keyframes dheat{0%{background:#ff5500;box-shadow:none}50%{background:#ffd27a;box-shadow:0 0 18px #ff8a2b}100%{background:#ff7a1a;box-shadow:0 0 26px #ff2d00}}
@keyframes dchar{to{background:#2e2e2e;box-shadow:none}}
@keyframes dcrumble{0%{background:#2e2e2e;opacity:1;transform:none;filter:none}100%{background:#1c1c1c;opacity:0;transform:translateY(-16px) scale(.86) rotate(-12deg);filter:blur(3px)}}
@keyframes ichar{from{color:#ff7a1a;text-shadow:0 0 8px #ff5500,0 0 26px #ff2d00}to{color:#2e2e2e;text-shadow:0 0 6px rgba(255,85,0,.35)}}
@keyframes icrumble{0%{color:#2e2e2e;opacity:1;transform:none;filter:none}100%{color:#1c1c1c;opacity:0;transform:translateY(-16px) scale(.86) skewX(-6deg);filter:blur(3px)}}
.il-fl{position:absolute;left:50%;bottom:-6%;width:120%;transform:translateX(-50%);aspect-ratio:1;pointer-events:none;z-index:-1}
.il{isolation:isolate}
.il-fl svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform-origin:50% 100%;filter:drop-shadow(0 0 10px #ff2d00);animation:ifl .75s ease-out forwards,lick .2s ease-in-out infinite alternate}
@keyframes ifl{0%{opacity:0}22%{opacity:.95}70%{opacity:.9}100%{opacity:0}}
.il-ash{position:absolute;inset:0;pointer-events:none}
.il-ash i{position:absolute;opacity:0;animation:flake 1.3s cubic-bezier(.2,.6,.4,1) forwards}
.intro-logo{position:relative;display:flex;align-items:flex-end;font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.05em;line-height:1}

@keyframes introOut{to{opacity:0;visibility:hidden}}
.flake{position:absolute;height:4px;opacity:0;animation:flake 1.4s ease-out forwards}
@keyframes flake{0%{opacity:0;transform:none}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.ashburn{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden;border-radius:inherit}
.ash-front{position:absolute;left:0;right:0;top:0;height:140%;background:linear-gradient(180deg,rgba(255,210,122,0) 0,#ffd27a 4%,#ff5500 9%,#5a1a04 16%,#1c1c1c 30%,#141414);transform:translateY(100%);animation:ashUp 1.7s ease-in-out forwards}
.ash-front svg{position:absolute;transform-origin:50% 90%;animation:lick var(--t) ease-in-out infinite alternate;animation-delay:var(--d);filter:drop-shadow(0 0 6px #ff5500)}
.ash-front span:nth-child(3n){color:#ffd27a}.ash-front span:nth-child(3n+1){color:#ff2d00}
@keyframes ashUp{to{transform:translateY(-15%)}}
@keyframes flk{50%{transform:scaleY(1.3) translateY(-3px)}}
.ash-char{position:absolute;inset:0;background:#141414;opacity:0;animation:ashChar .3s ease 1.75s forwards}
@keyframes ashChar{to{opacity:1}}
.ash-flakes{position:absolute;inset:0}

.pv-stk{gap:6px;padding:6px 8px;align-content:center}
.pv-stk .tsticker{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:clip;font-size:11px!important;border-width:2px}
/* animated fire + glitch rings */
.ring-fire,.ring-glitch{isolation:isolate}
.ring-fire::after{content:"";position:absolute;inset:-2%;border-radius:50%;z-index:-2;pointer-events:none;box-shadow:0 0 18px 5px rgba(255,70,0,.55),0 0 6px 1px rgba(255,210,122,.9);animation:fglow 1.7s ease-in-out infinite alternate}
@keyframes fglow{0%{opacity:.75;transform:scale(1)}40%{opacity:1;transform:scale(1.04)}70%{opacity:.85;transform:scale(1.01)}100%{opacity:1;transform:scale(1.06)}}
@keyframes flick{0%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.07) rotate(3deg)}100%{opacity:.9;transform:scale(.98)}}
.ring-glitch::before,.ring-glitch::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #00e5ff;z-index:2;pointer-events:none;mix-blend-mode:screen;animation:gl1 1.1s steps(1) infinite}
.ring-glitch::after{border-color:#ff2d55;animation:gl2 .9s steps(1) infinite}
@keyframes gl1{0%{transform:translate(0);clip-path:inset(0)}12%{transform:translate(-4px,1px);clip-path:inset(15% -20% 55% -20%)}24%{transform:translate(3px,-1px);clip-path:inset(60% -20% 8% -20%)}36%{transform:translate(0);clip-path:inset(0)}58%{transform:translate(2px,2px);clip-path:inset(35% -20% 40% -20%)}70%{transform:translate(-3px,0);clip-path:inset(0 -20% 75% -20%)}82%{transform:translate(0);clip-path:inset(0)}}
@keyframes gl2{0%{transform:translate(0);clip-path:inset(0)}18%{transform:translate(4px,-1px);clip-path:inset(45% -20% 30% -20%)}30%{transform:translate(-2px,1px);clip-path:inset(5% -20% 70% -20%)}44%{transform:translate(0);clip-path:inset(0)}66%{transform:translate(-4px,-2px);clip-path:inset(70% -20% 5% -20%)}78%{transform:translate(2px,0);clip-path:inset(25% -20% 50% -20%)}90%{transform:translate(0);clip-path:inset(0)}}
/* new animated headers */
.fx-wildfire{background:linear-gradient(0deg,#ff3d00 0%,#7a1a02 30%,#1a0601 65%,#0a0a0a)!important}
.fx-wildfire::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-10%;height:85%;pointer-events:none;
  background:radial-gradient(ellipse 22px 60px at 50% 100%,#ffd27a,#ff8a2b 40%,rgba(255,45,0,.7) 65%,transparent 75%) 0 100%/48px 100% repeat-x,radial-gradient(ellipse 30px 80px at 50% 100%,#ff5500,rgba(255,45,0,.6) 55%,transparent 72%) 24px 100%/64px 100% repeat-x;
  filter:blur(2px);animation:wild .5s steps(3) infinite;transform-origin:bottom}
.fx-wildfire::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ffd27a 1.4px,transparent 2px) 0 0/34px 46px,radial-gradient(circle,#ff8a2b 1.2px,transparent 1.8px) 17px 23px/46px 60px;animation:emberup 3.5s linear infinite}
@keyframes wild{0%{transform:scaleY(1);background-position:0 100%,24px 100%}50%{transform:scaleY(1.12);background-position:6px 100%,18px 100%}100%{transform:scaleY(.94);background-position:-4px 100%,30px 100%}}
@keyframes emberup{to{background-position:20px -184px,37px -217px}}
.fx-heatwave{background:linear-gradient(160deg,#ff2d00,#ff8a2b 50%,#ffd27a)!important}
.fx-heatwave::before{content:"";position:absolute;inset:-40% -20%;pointer-events:none;background:repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.2) 24px,rgba(255,255,255,0) 32px 46px);animation:heatup 2.6s linear infinite,heatsway 1.3s ease-in-out infinite alternate}
@keyframes heatup{to{background-position:0 -92px}}
@keyframes heatsway{from{transform:translateX(-12px) skewY(-2deg)}to{transform:translateX(12px) skewY(2deg)}}
@keyframes bliz{to{background-position:-60px 120px,-45px 104px}}
.fx-glitchtv{background:#060606!important}
.fx-glitchtv::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#00e5ff,#00e5ff) 0 22%/70% 6px no-repeat,linear-gradient(#ff2d55,#ff2d55) 40% 48%/55% 10px no-repeat,linear-gradient(#fff,#fff) 80% 70%/40% 3px no-repeat,linear-gradient(#ff5500,#ff5500) 10% 86%/35% 8px no-repeat;animation:gtv .9s steps(1) infinite}
.fx-glitchtv::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px),repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);animation:noise .2s steps(3) infinite}
@keyframes gtv{0%{background-position:0 22%,40% 48%,80% 70%,10% 86%}20%{background-position:60% 30%,0 62%,20% 12%,90% 52%;opacity:.4}40%{background-position:20% 8%,80% 80%,50% 40%,30% 30%;opacity:1}60%{opacity:0}75%{background-position:90% 55%,10% 18%,0 90%,60% 66%;opacity:1}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes stardrift{to{background-position:-370px 0,-577px 19px}}
@keyframes shoot{0%,70%{background-position:7px 3px,-200px 10px}100%{background-position:7px 3px,140% 120px}}
@keyframes lava{0%{transform:translateY(20%) scale(1)}50%{transform:translateY(-10%) scale(1.15) rotate(8deg)}100%{transform:translateY(-25%) scale(.95) rotate(-6deg)}}
/* glowing themes */
.glowing .btn.orange:not(:disabled),.glowing .nav .create{box-shadow:0 0 16px var(--orange),0 0 4px var(--orange-2)}
.glowing .logo i{box-shadow:0 0 10px var(--orange),0 0 3px var(--orange-2)}
.glowing .t-level,.glowing .badge{text-shadow:0 0 10px var(--orange)}
.glowing .orb-ring,.glowing .story-ring{filter:drop-shadow(0 0 6px var(--orange))}
.glowing .nav button[aria-current="page"]::after{box-shadow:0 0 8px var(--orange)}
.glow-sw{box-shadow:0 0 18px var(--sw),0 0 4px var(--sw)}

@keyframes morph{0%,100%{border-radius:63% 37% 58% 42%/48% 62% 38% 52%}25%{border-radius:42% 58% 45% 55%/62% 40% 60% 38%}50%{border-radius:55% 45% 38% 62%/44% 56% 50% 50%}75%{border-radius:46% 54% 62% 38%/55% 44% 58% 42%}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function art(seed,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const r=rng(seed);
  const [a,b,d]=SETS[Math.floor(r()*SETS.length)];
  const grad=g.createLinearGradient(0,0,w*r(),h);grad.addColorStop(0,a);grad.addColorStop(1,b);g.fillStyle=grad;g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){const x=r()*w,y=r()*h,rad=(.2+r()*.5)*Math.max(w,h);const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,i%2?d+'cc':'#ffffff55');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,w,h)}
  g.fillStyle=d;g.globalAlpha=.92;
  if(r()>.5){g.beginPath();g.arc(w*(.3+r()*.4),h*(.35+r()*.3),Math.min(w,h)*(.12+r()*.14),0,7);g.fill()}
  else{const s=Math.min(w,h)*(.25+r()*.15),x=w*(.2+r()*.4),y=h*(.3+r()*.3);g.beginPath();if(g.roundRect)g.roundRect(x,y,s,s,s*.22);else g.rect(x,y,s,s);g.fill()}
  g.globalAlpha=1;for(let i=0;i<1400;i++){g.fillStyle=`rgba(255,255,255,${r()*.06})`;g.fillRect(r()*w,r()*h,1.5,1.5)}
  return c.toDataURL('image/jpeg',.84);
}
/* animated Replay clip: drifting color fields + the take typed out word by word */
const LOOP=8000;
function drawReel(g,w,h,t,seed,text){
  const r=rng(seed);const [a,b,d]=SETS[Math.floor(r()*SETS.length)];
  const p=t/LOOP;
  const grad=g.createLinearGradient(0,0,w,h);grad.addColorStop(0,a);grad.addColorStop(1,b);g.fillStyle=grad;g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){
    const ph=r()*6.28, sp=.6+r()*.8;
    const x=w*(.5+.38*Math.sin(p*6.28*sp+ph)), y=h*(.5+.38*Math.cos(p*6.28*sp*.8+ph*1.3)), rad=Math.max(w,h)*(.25+.15*r());
    const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,i%2?d+'dd':'rgba(255,255,255,.35)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,w,h);
  }
  const words=text.split(/\s+/);const fs=Math.round(Math.min(w*.085,46));
  g.font=`800 ${fs}px Unbounded, Figtree, sans-serif`;g.textBaseline='top';
  const lines=[];let line='';const maxW=w*.82;
  words.forEach(wd=>{const test=line?line+' '+wd:wd;if(g.measureText(test).width>maxW&&line){lines.push(line);line=wd}else line=test});if(line)lines.push(line);
  const shown=Math.min(words.length,Math.floor((t/(LOOP*.55))*words.length)+1);
  let count=0;const lh=fs*1.18;let y=h*.38-(lines.length*lh)/2;
  lines.forEach(L=>{let x=w*.09;L.split(' ').forEach(wd=>{count++;if(count<=shown){const age=Math.min(1,((t/(LOOP*.55))*words.length-count+1));
      g.globalAlpha=Math.max(0,Math.min(1,age*2));g.fillStyle='#fff';g.fillText(wd,x,y+(1-Math.min(1,age*2))*10)}
      x+=g.measureText(wd+' ').width});y+=lh});
  g.globalAlpha=1;
}

function reducer(s,a){
  const T=msg=>s.settings.quiet?s.toast:({msg,at:Date.now()});
  const mapPost=(id,f)=>s.posts.map(p=>p.id===id?f(p):p);
  const me=s.users.me;
  const settle=n=>{
    if(n.status==='gone'||n.status==='kept'||n.reel)return n;
    if(n.freeze>n.heat)return {...n,status:'frozen',burnEnds:null};
    if(n.heat>n.freeze&&n.status!=='burning')return {...n,status:'burning',burnEnds:s.now+DAY};
    return n};
  // each heat on an already-burning post adds an hour, up to a full 24 hours left
  const ignite=p=>{const n=settle({...p,heat:p.heat+1});return p.status==='burning'&&n.status==='burning'&&n.burnEnds?{...n,burnEnds:Math.min(n.burnEnds+36e5,s.now+DAY)}:n};
  switch(a.type){
    case 'tick':{
      if(a.paused) return s;
      const now=s.now+a.dt*RATE[s.rate]; const real=Date.now(); let toast=s.toast; let changed=false;
      if(s.rate==='real'&&s.stories.some(g=>g.items.some(i=>!i.uploading&&real-i.at>=DAY))){s={...s,stories:s.stories.map(g=>({...g,items:g.items.filter(i=>i.uploading||real-i.at<DAY)})).filter(g=>g.items.length)};changed=true}
      let points=s.points, week=s.week;
      const posts=[];
      for(const p of s.posts){
        if(p.status==='burning'&&now>=p.burnEnds){changed=true;posts.push({...p,status:'gone',goneAt:real});
          if(p.userId==='me')toast=T('Your take went viral');
          continue}
        if(p.status==='gone'&&real-p.goneAt>900){changed=true;continue}
        posts.push(p);
      }
      const stories=s.stories.map(st=>({...st,items:st.items.filter(i=>now-i.at<DAY)})).filter(st=>st.items.length);
      if(toast&&!(toast.sticky&&s.storyUploading)&&real-toast.at>2400)toast=null;
      return {...s,now,posts:changed?posts:s.posts,stories,toast,points,week};
    }
    case 'heat':{const tp=s.posts.find(x=>x.id===a.id);if(!tp||tp.myHeat||tp.status==='gone')return s;
      return {...s,week:tp.userId==='me'?{...s.week,heat:s.week.heat+1}:s.week,posts:mapPost(a.id,p=>({...ignite(p),myHeat:true}))}}
    case 'otherHeat':{const tp=s.posts.find(x=>x.id===a.id);if(!tp||tp.status==='gone')return s;

function FireLicks({size}){
  const n=size<40?11:size<70?15:20;const fs=Math.max(8,size*.27);const r=size/2-fs*.12;

  return html`<span className="fire-licks" aria-hidden="true">${layer(0,1.2,1.1)}${layer(1,.8,.8)}</span>`;
}

  const ringed=u.ring&&!noRing; const inner=ringed?size-6:size;
  let a=html`<div className="av" style=${{width:inner,height:inner,background:u.color,fontSize:inner*.38}}>${u.avatar?html`<img src=${u.avatar} alt="" />`:initials}</div>`;

}

  if(p.status==='frozen')return html`<span className="timer frozen" data-tour=${tag}><${Icon} n="snow" s=${14} w=${2.4}/>Frozen</span>`;

  return null; // heat time lives on the orange line under the post

    const end=()=>{v.currentTime=t0;setProg(0);v.play().catch(()=>{})};
    v.addEventListener('timeupdate',tu);v.addEventListener('ended',end);
    v.dataset.rate=o.speed||1;v.playbackRate=o.speed||1;
    if(active){if(v.ended||v.currentTime<t0||(o.trimEnd&&v.currentTime>=o.trimEnd))v.currentTime=t0;playSound(v)}else{v.pause();v.muted=true;v.currentTime=t0}
    return()=>{v.removeEventListener('timeupdate',tu);v.removeEventListener('ended',end)};
  },[active,runKey]);
  return html`${p.clip.kind==='art'?html`<canvas ref=${cv} aria-label=${p.text}></canvas>`:html`<video ref=${vd} src=${p.clip.url} muted playsInline></video>`}
    <${ReplayOverlay} o=${p.overlay}/>
    <div className="reel-prog"><div style=${{width:prog*100+'%'}}></div></div>`;
}

  const togglePause=()=>{paused.current=!paused.current;setPz(paused.current);const v=vid();if(v){paused.current?v.pause():v.play().catch(()=>{})}};
  const restart=()=>{setEnded(false);paused.current=false;setPz(false);setRunKey(k=>k+1)};
  const g=useVidTaps(()=>p.clip.kind==='video'?vid():null,{onSingle:()=>{ended?restart():togglePause()},onCenterDouble:()=>{if(!p.myHeat)dispatch({type:'heat',id:p.id});setBurst(Date.now())}});
  useEffect(()=>{if(!active){paused.current=false;setPz(false);setEnded(false)}},[active]);

// slot live creators in after the 2nd Replay, then every 5
function mixLives(reels,lives){if(!lives.length)return reels.map(p=>({p}));const out=[];let li=0;
  reels.forEach((p,i)=>{out.push({p});if(li<lives.length&&(i===1||(i>1&&(i-1)%5===0)))out.push({live:lives[li++]})});
  if(!reels.length)lives.forEach(l=>out.push({live:l}));return out}
function Replay({s,dispatch,open,startId}){
  const reels=s.posts.filter(p=>p.reel&&p.status!=='gone'&&visible(s,p));
  const {list:lives,people:lp}=useStreams();const items=mixLives(reels,lives.filter(x=>!s.blocked[x.host_id]));
  const box=useRef();const [active,setActive]=useState(startId||(reels[0]&&reels[0].id));
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)setActive(+e.target.dataset.id)}),{root:box.current,threshold:[.6]});
    box.current.querySelectorAll('.reel').forEach(el=>io.observe(el));
    if(startId){const el=box.current.querySelector(`[data-id="${startId}"]`);if(el)el.scrollIntoView()}
    return()=>io.disconnect();
  },[items.length]);
  const sw=useRef(null);
  return html`<div className="reels" ref=${box} onTouchStart=${e=>{const t=e.touches[0];sw.current={x:t.clientX,y:t.clientY}}} onTouchEnd=${e=>{const a=sw.current;sw.current=null;if(!a)return;const t=e.changedTouches[0];const dx=t.clientX-a.x,dy=t.clientY-a.y;if(dx>70&&Math.abs(dx)>Math.abs(dy)*2)open.leaveReplay()}}>
    <div className="reel-top" style=${{position:'fixed',maxWidth:520,margin:'0 auto',color:'#fff'}}><h2>Replay</h2>
      <button className="circle" style=${{background:'rgba(255,255,255,.14)',color:'#fff'}} aria-label="New Replay" onClick=${()=>open.compose(true)}><${Icon} n="camera"/></button></div>
    ${items.map(it=>it.live?html`<${LiveReel} key=${'live-'+it.live.id} x=${it.live} h=${lp[it.live.host_id]||liveUser(null)}/>`:html`<${Reel} key=${it.p.id} p=${it.p} s=${s} active=${active===it.p.id} dispatch=${dispatch} open=${open}/>`)}
    ${!items.length&&html`<div className="empty" style=${{color:'#fff',paddingTop:'40vh'}}>Nothing to replay</div>`}
  </div>`;
}

const GIPHY_KEY='b2Iegy5NrTJZ6CeatyDooV0oumjBTBYH';
async function giphy(q){
  const base='https://api.giphy.com/v1/gifs/'+(q?'search':'trending');
  const u=base+'?api_key='+GIPHY_KEY+'&limit=30&rating=pg-13&bundle=messaging_non_clips'+(q?'&q='+encodeURIComponent(q):'');
  const r=await fetch(u);if(!r.ok)throw new Error('GIF search isn’t available right now.');
  const j=await r.json();
  return (j.data||[]).map(g=>({id:g.id,title:g.title,thumb:(g.images.fixed_width_small||g.images.fixed_width).url,
    url:(g.images.downsized_medium||g.images.downsized||g.images.original).url,w:+g.images.fixed_width.width,h:+g.images.fixed_width.height}));
}

function Sticker({v,size=58}){
  if(!v)return null;

    return html`<span className=${'tsticker ts-'+(c||'o')} style=${{'--r':rot+'deg',fontSize:Math.max(10,size*.27)}}>${t}</span>`}
  if(v.startsWith('G|'))return html`<img className="gsticker" src=${v.slice(2)} alt="GIF" loading="lazy"/>`;
  if(v.startsWith('I|'))return html`<img className="isticker" src=${v.slice(2)} alt="Sticker" style=${{width:size*1.2,height:size*1.2}}/>`;
  return html`<span className="sticker" style=${{fontSize:size}}>${v}</span>`;
}

// home feed: header and tab bar slide away while scrolling down, come back on scroll up
// tap any empty spot (not a field or button) to put the keyboard away
document.addEventListener('pointerup',e=>{const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  if(e.target.closest('input,textarea,button,a,label,select,[role="button"]'))return;a.blur()},true);
// pill tab bars (.seg): slide a finger along the bar and the tab under it is picked as you go
(()=>{let seg=null,last=null,x0=0,moved=false;
  document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const sg=e.target.closest('.seg');if(!sg)return;seg=sg;x0=e.clientX;moved=false;last=e.target.closest('.seg button')},true);
  document.addEventListener('pointermove',e=>{if(!seg)return;if(Math.abs(e.clientX-x0)>6)moved=true;if(!moved)return;
    const r=seg.getBoundingClientRect();const y=r.top+r.height/2;const x=Math.max(r.left+6,Math.min(r.right-6,e.clientX));
    const b=document.elementFromPoint(x,y);const btn=b&&b.closest&&b.closest('.seg button');if(btn&&btn!==last&&seg.contains(btn)){last=btn;btn.click()}},true);
  const end=()=>{seg=null};document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true);})();
// swipe in from the left edge to go back (presses the page's Back button)
(()=>{let st=null;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];st=t.clientX<32&&!document.querySelector('.scrim,.sv,.fullv')?{x:t.clientX,y:t.clientY}:null},{passive:true});
  document.addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0];const dx=t.clientX-st.x,dy=t.clientY-st.y;st=null;
    if(dx>80&&Math.abs(dx)>Math.abs(dy)*1.5){const b=document.querySelector('.top button[aria-label="Back"], .header-img button[aria-label="Back"], button[aria-label="Back"]');if(b)b.click();else if(window.__openGoLive)window.__openGoLive()}},{passive:true});})();
function BarsOnScroll({on}){
  useEffect(()=>{const b=document.body;if(!on){b.classList.remove('bars-off');return}
    let last=scrollY;const f=()=>{const y=scrollY,dy=y-last;last=y;if(y<40)b.classList.remove('bars-off');else if(dy>6)b.classList.add('bars-off');else if(dy<-6)b.classList.remove('bars-off')};
    addEventListener('scroll',f,{passive:true});return()=>{removeEventListener('scroll',f);b.classList.remove('bars-off')}},[on]);
  return null;
}

// send points to someone in a chat: preset amounts or your own, plus an optional note
function SendPoints({s,to,dispatch,onClose}){
  const u=s.users[to]||{};const [amt,setAmt]=useState(25);const [custom,setCustom]=useState('');const [note,setNote]=useState('');
  const bal=s.points||0;const n=custom?Math.floor(+custom||0):amt;const bad=n<1||n>bal;
  return html`<${Sheet} onClose=${onClose} label="Send points"><div className="sheet-head"><h3>Send points</h3></div>
    <div className="sp-body"><p className="sub"><${Icon} n="flame" s=${14} fill="var(--orange)"/> You have ${kfmt(bal)} pts</p>
      <div className="sp-chips">${[10,25,50,100,250,500].map(v=>html`<button key=${v} aria-pressed=${!custom&&amt===v} disabled=${v>bal} onClick=${()=>{setAmt(v);setCustom('')}}>${v}</button>`)}</div>
      <input className="sp-in" inputMode="numeric" placeholder="Other amount" value=${custom} onInput=${e=>setCustom(e.target.value.replace(/[^0-9]/g,'').slice(0,6))} aria-label="Other amount"/>

}
function Thread({s,id,dispatch,simulateReply,onTyping,open}){
  const [t,setT]=useState('');const [pts,setPts]=useState(false);const end=useRef();const [err,setErr]=useState(null);const [pick,setPick]=useState(false);const [gif,setGif]=useState(false);
  const msgs=s.threads[id]||[];
  const [vsend,setVsend]=useState(false);
  const vr=useVoiceRecorder(async(file,ms)=>{setVsend(true);try{const url=await upload(file);dispatch({type:'dm',to:id,audio:url,ms})}catch(e){setErr(friendly(e))}setVsend(false)});
  // drag the conversation sideways to peek at send times, like iMessage
  const box=useRef();const drag=useRef(null);
  const dDown=e=>{if(e.target.closest('button,input,audio,a,.v-wave'))return;drag.current={x:e.clientX,y:e.clientY,on:false}};
  const dMove=e=>{const d=drag.current;if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.on){if(dx>-8||Math.abs(dx)<Math.abs(dy)*1.3){if(Math.abs(dy)>10||dx>10)drag.current=null;return}d.on=true}
    const el=box.current;if(!el)return;const sh=Math.max(-72,Math.min(0,dx));el.style.setProperty('--shift',sh+'px');el.style.setProperty('--tmo',Math.max(0,Math.min(1,(-sh-24)/48)));el.classList.add('peeking')};
  const dUp=()=>{drag.current=null;const el=box.current;if(!el)return;el.classList.remove('peeking');el.style.setProperty('--shift','0px');el.style.setProperty('--tmo','0')};
  const clock=at=>new Date(at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  useEffect(()=>{dispatch({type:'read',id})},[id,msgs.length]);
  useEffect(()=>{end.current&&end.current.scrollIntoView({block:'end'})},[msgs.length,s.typing[id]]);
  const send=()=>{if(!t.trim())return;const why=MOD.rules(MOD.classify(t),s.users.me.plus,isAdult(s));if(why)return setErr(why);dispatch({type:'dm',to:id,text:t.trim()});setT('');simulateReply(id)};
  const sendSticker=e=>{dispatch({type:'dm',to:id,sticker:e});setPick(false);simulateReply(id)};
  const lastMine=[...msgs].reverse().find(m=>m.from==='me');
  const seen=s.settings.receipts&&lastMine&&s.seenBy[id]&&s.seenBy[id]>=lastMine.at;
  const onlyEmoji=x=>/^\p{Extended_Pictographic}{1,3}$/u.test(x||'');
  return html`<div>
    <div className="msgs" ref=${box} onPointerDown=${dDown} onPointerMove=${dMove} onPointerUp=${dUp} onPointerCancel=${dUp} onPointerLeave=${dUp}>
      ${msgs.map(m=>{
        const mine=m.from==='me';
        if(m.postId){const live=s.posts.find(x=>x.id===m.postId&&x.status!=='gone');const p=live?{...live,media:live.media||(live.poster?{type:'image',url:live.poster}:null)}:m.snap;
          if(!p)return null;
          return html`<div className="mrow" key=${m.id}><span className="mt">${clock(m.at)}</span><div className=${'shared'+(mine?'':' theirs')}>
            ${p.media&&(p.media.type==='video'?html`<video src=${p.media.url} controls playsInline muted></video>`:html`<img src=${p.media.url} alt="" />`)}
            <div className="sh-body"><span className="sh-by">@${s.users[p.userId].handle}${!live?' · gone from the timeline':''}</span>${p.text&&html`<span>${p.text}</span>`}</div></div></div>`}
        return html`<div className="mrow" key=${m.id}><span className="mt">${clock(m.at)}</span>
          ${m.note&&html`<div className=${'msg-note'+(mine?' mine':'')}>${m.note}</div>`}
          <div className=${'msg'+(mine?' mine':'')+(m.points?' ptsmsg':m.audio?' vmsg':m.sticker?' stk':onlyEmoji(m.text)?' big':'')+(m.react?' has-react':'')} onDoubleClick=${()=>dispatch({type:'reactMsg',to:id,mid:m.id})}>${m.points?html`<div className=${'pts-card'+(mine?' mine':'')}><div className="pts-amt"><${Icon} n="flame" s=${20} fill="currentColor"/><b>${kfmt(m.points)}</b><span>pts</span></div><small>${mine?'You sent points':'Sent you points'}</small>${m.text&&html`<p>${m.text}</p>`}</div>`:m.audio?html`<${VoiceMsg} url=${m.audio} ms=${m.ms} mine=${mine}/>`:m.sticker?html`<${Sticker} v=${m.sticker} size=${58}/>`:m.text}${m.react&&html`<span className="msg-react">${m.react}</span>`}</div></div>`})}
      ${!s.typing[id]&&lastMine&&msgs[msgs.length-1]===lastMine&&html`<div className="seen">${seen||lastMine.readAt?'Seen'+((lastMine.readAt||s.seenBy[id])?' '+clock(Math.max(lastMine.readAt||0,s.seenBy[id]||0)):''):(lastMine.id>0?'Delivered':'Sending…')}</div>`}
      ${s.typing[id]&&html`<div className="typing" aria-label="typing"><span></span><span></span><span></span></div>`}
      <div ref=${end}></div>
    </div>
    <div className="dm-input">${vr.rec||vsend?html`<div className="inputbar rec-bar"><span className="rec-dot2"></span><b>${vsend?'Sending…':fmtSec(vr.rec.ms)}</b><span className="grow sub">${vsend?'':'Recording'}</span>
        ${!vsend&&html`<button className="stk-btn" onClick=${()=>vr.stop(false)} aria-label="Cancel voice message"><${Icon} n="x" s=${20}/></button><button className="send" onClick=${()=>vr.stop(true)} aria-label="Send voice message"><${Icon} n="share" s=${18}/></button>`}</div>`:null}
      <div style=${vr.rec||vsend?{display:'none'}:null}>${pick&&html`<${StickerPicker} s=${s} onPick=${sendSticker}/>`}${gif&&html`<${GifPicker} onClose=${()=>setGif(false)} onPick=${g=>{sendSticker('G|'+g.url);setGif(false)}}/>`}<${ModError} err=${err} open=${open}/><div className="inputbar"><label htmlFor="dm-in" className="vh">Message</label>
      <input id="dm-in" placeholder="Message…" value=${t} onChange=${e=>{setT(e.target.value);setErr(null);onTyping&&onTyping(id)}} onKeyDown=${e=>e.key==='Enter'&&send()}/>
      <button className="stk-btn gif-btn" aria-label="GIFs" aria-pressed=${gif} onClick=${()=>{setGif(!gif);setPick(false)}}>GIF</button>
      <button className="stk-btn" aria-label="Stickers" aria-pressed=${pick} onClick=${()=>setPick(!pick)}><${Icon} n="smile" s=${22}/></button>
      ${id!=='temp'&&html`<button className="stk-btn" aria-label="Send points" onClick=${()=>setPts(true)}><${Icon} n="flame" s=${21}/></button>`}
      ${t.trim()?html`<button className="send" onClick=${send} aria-label="Send"><${Icon} n="share" s=${18}/></button>`:html`<button className="send mic" onClick=${vr.start} aria-label="Record a voice message"><${Icon} n="mic" s=${19}/></button>`}</div></div></div>
    ${pts&&html`<${SendPoints} s=${s} to=${id} dispatch=${dispatch} onClose=${()=>setPts(false)}/>`}
  </div>`;
}
