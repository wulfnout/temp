<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%;overscroll-behavior:none}body{overflow-x:clip;overscroll-behavior:none;max-width:100%}input,textarea,select{font-size:16px!important}*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}.stories,.deals,.picker{touch-action:pan-x pan-y;overscroll-behavior-x:contain}</style>
<meta name="theme-color" content="#ff5500">
<meta name="description" content="Temp: hot takes with a shelf life.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Ctext x='12' y='46' font-family='Arial Black,Arial' font-weight='900' font-size='38' fill='%23ffffff'%3Et%3C/text%3E%3Crect x='42' y='36' width='10' height='10' rx='2' fill='%23ff5500'/%3E%3C/svg%3E">
<title>Temp</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: card feed on a toned ground — wordmark header, morphing story orbs, rounded post cards, full-screen Replay, settings as stacked grouped lists, solid bottom bar */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#eeedeb; --card:#ffffff; --soft:#f4f3f1; --ink:#0a0a0a; --muted:#7c7671; --line:#e2dfdb;
  --orange:#ff5500; --orange-2:#ff8a2b; --on-orange:#ffffff; --orange-soft:#ffeadf; --scrim:rgba(10,10,10,.42); --ok:#22c55e;
  --display:"Unbounded",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#111111; --soft:#1c1c1c; --ink:#ffffff; --muted:#8d8883; --line:#252525;
  --orange:#ff5c0a; --orange-2:#ff8f33; --on-orange:#ffffff; --orange-soft:#2a1206; --scrim:rgba(0,0,0,.66); --ok:#22c55e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111111; --soft:#1c1c1c; --ink:#ffffff; --muted:#8d8883; --line:#252525;
  --orange:#ff5c0a; --orange-2:#ff8f33; --on-orange:#ffffff; --orange-soft:#2a1206; --scrim:rgba(0,0,0,.66); --ok:#22c55e; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink)}
img,video{max-width:100%;display:block}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;transition:transform .22s ease}
.nav{transition:transform .22s ease}
.bars-off .top{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.bars-off .nav{transform:translateY(100%)}
.top-row{display:flex;align-items:center;gap:10px;height:44px}
.logo{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.04em;line-height:1;margin:0;display:flex;align-items:flex-end;gap:3px}
.logo i{width:9px;height:9px;background:var(--orange);display:inline-block;border-radius:2px;margin-bottom:3px}
.top-title{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:6px;margin-left:auto}
.circle{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin-top:10px;gap:2px}
.seg button{flex:1;padding:9px 4px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:var(--on-orange);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.dot-badge{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:3px;background:var(--orange);box-shadow:0 0 0 2px var(--card)}

/* morphing story orbs */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.stories::-webkit-scrollbar{display:none}
.story{display:grid;justify-items:center;gap:7px;flex:none;width:76px}
.story > span{font-size:12px;font-weight:600;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.orb{width:74px;height:74px;padding:3px;position:relative;display:block;
  background:conic-gradient(from var(--spin),var(--orange),var(--orange-2),#ffd27a,var(--orange-2),var(--orange));
  animation:morph 7s ease-in-out infinite,spin 3.5s linear infinite;border-radius:60% 40% 55% 45%/50% 60% 40% 50%}
.orb.seen{background:var(--line);animation:morph 11s ease-in-out infinite}
.orb > .av{width:100%;height:100%;border-radius:inherit;border:3px solid var(--bg)}
.orb .add{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:8px;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;border:3px solid var(--bg)}
.story:nth-child(2n) .orb{animation-delay:-2s,-1s}.story:nth-child(3n) .orb{animation-delay:-4s,-2s}.story:nth-child(5n) .orb{animation-duration:9s,4.5s}

.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:var(--ink);position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;display:inline-block;flex:none}
.online{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card)}
.verified{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;background:var(--orange);color:#fff;vertical-align:-2px;margin-left:4px;flex:none}

/* post */
.feed{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.post{background:var(--card);border-radius:26px;padding:14px;position:relative;overflow:hidden;
  transition:opacity .7s ease,filter .7s ease,transform .7s ease,max-height .7s ease .1s,padding .7s ease .1s,margin .7s ease .1s;max-height:2000px}
.post.gone{opacity:0;filter:blur(8px);transform:scale(.96);max-height:0;padding-block:0;margin-top:-10px}
.p-head{display:flex;align-items:center;gap:10px;min-width:0}
.p-id{min-width:0;display:flex;flex-direction:column;line-height:1.2;text-align:left}
.p-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.p-sub{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-right{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.p-more{color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.p-more:hover{background:var(--soft);color:var(--ink)}
.p-text{margin:12px 2px 0;font-size:16.5px;line-height:1.38;overflow-wrap:anywhere;white-space:pre-wrap;font-weight:500}
.p-text.big{font-family:var(--display);font-size:19px;line-height:1.28;font-weight:700;letter-spacing:-.03em}
.tag{color:var(--orange);font-weight:700}
.media{margin-top:12px;border-radius:20px;overflow:hidden;position:relative;background:var(--soft);user-select:none}
.media img,.media video{width:100%;max-height:600px;object-fit:cover}
.gif-tag{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;letter-spacing:.04em}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--orange);z-index:3}
.burst svg{animation:burst .9s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(0 6px 24px rgba(255,85,0,.6))}
.timer{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.timer.burning{background:var(--orange);color:var(--on-orange)}
.timer.frozen{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.timer.frozen{background:var(--ink);color:var(--bg);box-shadow:none}
.post.is-frozen .p-head .av,.post.is-frozen .p-id,.post.is-frozen .cover-wrap,.post.is-frozen .p-comments{filter:grayscale(1);opacity:.45}
.post.is-frozen{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.ic:disabled{opacity:.3;cursor:not-allowed}
.reel.is-frozen canvas,.reel.is-frozen video,.reel.is-frozen .reel-info{filter:grayscale(1);opacity:.55}
.rail-btn:disabled{opacity:.35;cursor:not-allowed}
.life{position:absolute;left:0;bottom:0;height:3px;transition:width .25s linear}
.life.burning{background:var(--orange)} .life.frozen{background:var(--ink)}
.p-actions{display:flex;align-items:center;gap:6px;margin-top:12px}
.react{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .15s}
.react:active{transform:scale(.94)}
.react.heat.on{background:var(--orange);color:var(--on-orange)}
.react.freeze.on{background:var(--ink);color:var(--bg)}
.react.on svg{animation:pop .4s ease}
.social{margin-left:auto;display:flex;gap:0}
.ic{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 8px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink)}
.ic:hover{background:var(--soft)}
.ic .n{color:var(--muted)}
.ic.on{color:var(--orange)}
.p-comments{font-size:14px;color:var(--muted);margin:10px 2px 0;text-align:left;display:block;font-weight:500;overflow-wrap:anywhere}
.p-comments b{color:var(--ink);font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav button{width:56px;height:46px;display:grid;place-items:center;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:2px;background:var(--orange)}
.nav .create{width:54px;height:44px;border-radius:15px;background:var(--orange);color:var(--on-orange)}
.nav.dark{background:#000;border-color:#1c1c1c}
.nav.dark button{color:#8d8883}.nav.dark button[aria-current="page"]{color:#fff}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0 0 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h3{margin:0}
.btn{background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 20px;font-weight:800;font-size:14px;white-space:nowrap}
.btn.orange{background:var(--orange);color:var(--on-orange)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.wide{width:100%;padding:16px;font-size:16px}
.row{display:flex;align-items:center;gap:12px;padding-block:9px}
.row .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px;font-weight:500}
.menu{background:var(--soft);border-radius:20px;overflow:hidden}
.menu-item{width:100%;text-align:left;padding:16px;font-weight:700;display:flex;gap:12px;align-items:center}
.menu-item + .menu-item{border-top:1px solid var(--line)}
.menu-item.warn{color:var(--orange)}

.compose{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px}
.compose textarea{width:100%;border:0;resize:none;background:transparent;font-size:19px;font-weight:500;min-height:110px;padding-top:9px}
.compose textarea::placeholder{color:var(--muted)}
.c-preview{position:relative;margin-top:6px}
.c-remove{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;z-index:2}
.c-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.c-tools{display:flex;gap:6px;flex-wrap:wrap}
.c-tools button{height:40px;padding:0 14px;border-radius:999px;background:var(--soft);display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.count{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.count.over{color:var(--orange)}
.mode{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
.mode button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

.comment{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding-block:9px;align-items:start}
.comment p{margin:2px 0 0;overflow-wrap:anywhere}
.c-meta{display:flex;gap:14px;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:700}
.c-like{display:grid;justify-items:center;gap:1px;color:var(--muted);font-size:11.5px;font-weight:700;padding-top:4px;min-width:28px}
.c-like.on{color:var(--orange)}
.c-like.on svg{animation:pop .35s ease}
.inputbar{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--soft);border-radius:999px;padding:4px 4px 4px 16px}
.inputbar input{flex:1;border:0;background:transparent;padding:10px 0;min-width:0;font-weight:500}
.inputbar input:focus-visible{outline:none}
.inputbar:focus-within{box-shadow:inset 0 0 0 2px var(--orange)}
.send{width:40px;height:40px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.3}

/* profile */
.prof{background:var(--card);border-radius:0 0 30px 30px;overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:18px}
.header-img{height:180px;background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 40%,#0a0a0a 100%);overflow:hidden;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.header-img img{width:100%;height:100%;object-fit:cover}
.header-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.header-btn.l{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
.prof-top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-48px;gap:8px}
.prof-top .av{border:5px solid var(--card)}
.prof-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.prof-name{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.04em;margin:12px 0 2px;line-height:1.05;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prof-bio{margin:10px 0 0;font-weight:500}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--soft);border-radius:16px;padding:10px 14px;display:grid;min-width:76px;text-align:left}
.stat b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px;border-radius:20px;overflow:hidden}
.grid3 button{aspect-ratio:1;background:var(--card);position:relative;overflow:hidden;max-width:100%}
.grid3 button.tall{aspect-ratio:9/16}
.grid3 img{width:100%;height:100%;object-fit:cover}
.grid3 .txt{position:absolute;inset:0;padding:10px;font-weight:700;font-size:12.5px;text-align:left;overflow:hidden;line-height:1.25}
.grid3 .rp{position:absolute;left:8px;bottom:8px;color:#fff;font-weight:800;font-size:12px;display:flex;gap:4px;align-items:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.edit-header{position:relative;height:130px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 40%,#0a0a0a 100%)}
.edit-header img{width:100%;height:100%;object-fit:cover}
.overlay-btn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3);color:#fff;font-weight:700}
.edit-av{position:relative;margin-top:-36px;margin-left:14px;width:82px;height:82px}
.edit-av .av{border:4px solid var(--card)}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:0;border-radius:16px;padding:14px 16px;background:var(--card);width:100%;font-weight:500}
.sheet .field input,.sheet .field textarea{background:var(--soft)}
.field textarea{resize:vertical;min-height:76px}

/* settings */
.set-group{background:var(--card);border-radius:24px;overflow:hidden;margin-top:12px}
.set-label{font-family:var(--display);font-size:12.5px;font-weight:700;margin:22px 6px 0;letter-spacing:-.01em}
.set-item{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-weight:700;min-height:56px}
.set-item + .set-item{border-top:1px solid var(--line)}
.set-item .si{width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:none}
.set-item .grow{flex:1;min-width:0}
.set-item .val{color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.set-item.warn{color:var(--orange)}
.set-item .chev{color:var(--muted)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--orange)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.radio.on{box-shadow:inset 0 0 0 7px var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 8px 7px 13px;font-weight:700;font-size:14px}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 16px;height:46px;flex:1}
.search input{border:0;background:transparent;flex:1;min-width:0;font-weight:600}
.search input:focus-visible{outline:none}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--orange)}
.trends{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.trend{background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:baseline}
.trend span{color:var(--muted);font-weight:600;font-size:12px}

/* lists */
.list-card{background:var(--card);border-radius:26px;padding:6px 14px;margin-top:8px}
.thread-row{display:flex;gap:12px;align-items:center;padding-block:10px;width:100%;text-align:left}
.thread-row + .thread-row{border-top:1px solid var(--line)}
.thread-row .grow{flex:1;min-width:0}
.thread-row b{font-weight:800}
.thread-row .last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.notif.unread{background:linear-gradient(90deg,var(--orange-soft,transparent),transparent)}
.n-ico{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.section-label{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:-.01em;margin:20px 4px 4px}

.msgs{display:flex;flex-direction:column;gap:4px;padding-block:14px}
.msg{max-width:78%;padding:10px 15px;border-radius:22px;background:var(--card);align-self:flex-start;overflow-wrap:anywhere;font-weight:500;position:relative;user-select:none}
.msg.mine{align-self:flex-end;background:var(--orange);color:var(--on-orange)}
.msg.big{background:transparent!important;font-size:40px;padding:0 4px}
.msg-react{position:absolute;bottom:-12px;right:8px;background:var(--card);border-radius:999px;padding:1px 5px;font-size:13px;box-shadow:0 0 0 2px var(--bg)}
.msg.mine .msg-react{right:auto;left:8px}
.msg.has-react{margin-bottom:12px}
.msg-note{font-size:12px;color:var(--muted);font-weight:600;margin:2px 6px}
.msg-note.mine{align-self:flex-end}
.seen{align-self:flex-end;font-size:12px;color:var(--muted);font-weight:700;margin:2px 6px}
.typing{align-self:flex-start;background:var(--card);border-radius:22px;padding:13px 16px;display:flex;gap:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.shared{border-radius:22px;overflow:hidden;background:var(--card);color:var(--ink);width:min(78%,300px);align-self:flex-end;display:grid}
.shared.theirs{align-self:flex-start}
.shared img,.shared video{max-height:200px;object-fit:cover;width:100%}
.shared .sh-body{padding:10px 14px;display:grid;gap:4px;font-weight:500}
.shared .sh-by{font-size:12px;color:var(--muted);font-weight:800}
.dm-input{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.dm-input .inputbar{background:var(--card)}

/* story viewer */
.sv{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;justify-content:center;animation:fade .2s ease}
.sv-in{position:relative;width:100%;max-width:480px;height:100%}
.sv-media{position:absolute;inset:0;display:grid;place-items:center}
.sv-media img,.sv-media video{width:100%;height:100%;object-fit:cover}
.sv-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:4px;z-index:2}
.sv-bars div{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.sv-bars span{display:block;height:100%;background:#fff}
.sv-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;z-index:3;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sv-head .t{font-weight:500;opacity:.75;font-size:13px}
.sv-btns{margin-left:auto;display:flex}
.sv-close{width:38px;height:38px;display:grid;place-items:center;color:#fff}
.sv-touch{position:absolute;left:0;right:0;top:70px;bottom:120px;z-index:1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sv-count{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;font-family:var(--display);font-weight:800;font-size:96px;color:#000;text-shadow:0 0 18px rgba(255,255,255,.85)}
.sv-tap.l{left:0} .sv-tap.r{right:0;width:60%}
.sv-foot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:grid;gap:10px}
.sv-reacts{display:flex;justify-content:space-around}
.sv-reacts button{font-size:28px;transition:transform .15s}
.sv-reacts button:active{transform:scale(1.4)}
.sv-input{display:flex;gap:8px;align-items:center;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 4px 4px 16px}
.sv-input input{flex:1;background:transparent;border:0;color:#fff;padding:9px 0;min-width:0}
.sv-input input::placeholder{color:rgba(255,255,255,.7)}
.sv-input input:focus-visible{outline:none}

/* replay */
.reels{position:fixed;left:0;right:0;top:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:25;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center;color:#fff}
.reel-in{position:relative;height:100%;width:auto;aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#0a0a0a}
.reel canvas,.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 60%,rgba(0,0,0,.7));pointer-events:none}
.reel-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;z-index:3}
.reel-top h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;margin:0}
.replays{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.reel-info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:84px;bottom:22px;z-index:3;display:grid;gap:10px}
.reel-who{display:flex;align-items:center;gap:10px;font-weight:800}
.reel-who .btn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7);padding:6px 12px;font-size:12.5px}
.reel-cap{font-weight:600;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.5);overflow-wrap:anywhere}
.reel-rail{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:22px;z-index:3;display:grid;gap:14px;justify-items:center}
.rail-btn{display:grid;justify-items:center;gap:3px;font-weight:800;font-size:12.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rail-btn .rb{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rail-btn.on .rb{background:var(--orange)}
.rail-btn.rp.on .rb{background:#22c55e}
.rail-btn:disabled{opacity:.35}
.rail-btn.ice.on .rb{background:#fff;color:#000}
.reel-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:3}
.reel-prog div{height:100%;background:var(--orange)}
.reel-pause{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.reel-pause span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;animation:fade .2s ease}
.reel-timer{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:3}

/* welcome */
.welcome{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.welcome-in{width:100%;max-width:400px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:100%}
.w-hero{display:grid;gap:18px;padding-top:6vh}
.w-mark{font-family:var(--display);font-weight:800;font-size:clamp(68px,22vw,104px);letter-spacing:-.06em;line-height:.85;margin:0;display:flex;align-items:flex-end;gap:6px}
.w-mark i{width:22px;height:22px;background:var(--orange);border-radius:5px;margin-bottom:8px;animation:tick 1s steps(1) infinite}
.w-orbs{display:flex;gap:10px}
.w-orbs span{width:44px;height:44px;background:conic-gradient(from var(--spin),var(--orange),var(--orange-2),#ffd27a,var(--orange));animation:morph 6s ease-in-out infinite,spin 3s linear infinite;border-radius:50%}
.w-orbs span:nth-child(2){background:var(--ink);animation-delay:-2s}
.w-orbs span:nth-child(3){background:var(--line);animation-delay:-4s}
.w-form{display:grid;gap:2px}
.pw{display:flex;align-items:center;background:var(--card);border-radius:16px}
.pw input{flex:1;min-width:0;background:transparent!important}
.pw button{padding:0 16px;font-weight:800;font-size:13px;color:var(--muted);align-self:stretch}
.a-link{color:var(--orange);font-weight:800;font-size:14px;justify-self:end;margin-top:10px}
.a-err{color:var(--orange);font-weight:700;font-size:14px;margin:12px 4px 0}
.a-note{color:var(--ink);font-weight:600;font-size:14px;margin:12px 4px 0;background:var(--card);padding:12px 14px;border-radius:14px}
.field input[type=date]{min-height:50px}

/* tour */
.tour{position:fixed;inset:0;z-index:100;pointer-events:none}
.tour-dim,.tour-card{pointer-events:auto}
.tour-dim{position:fixed;background:rgba(0,0,0,.52);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tour-ring{position:fixed;box-shadow:0 0 0 3px var(--orange),0 0 0 9px rgba(255,85,0,.22);pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1);animation:ring 1.6s ease-in-out infinite}
.tour-card{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--card);color:var(--ink);border-radius:26px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  transition:top .35s cubic-bezier(.2,.9,.3,1),left .35s cubic-bezier(.2,.9,.3,1);animation:up .3s ease}
.tour-card.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%);animation:none}
.t-step{font-size:12px;color:var(--orange);font-weight:800;font-variant-numeric:tabular-nums}
.t-title{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.03em;margin:6px 0 6px;line-height:1.15;text-wrap:balance}
.t-body{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.t-try{margin-top:12px;font-weight:800;font-size:14px;color:var(--on-orange);background:var(--orange);padding:10px 14px;border-radius:16px}
.t-try.done{color:var(--ink);background:var(--soft)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.t-skip{color:var(--muted);font-size:14px;font-weight:700}
.t-dots{display:flex;gap:4px;margin-top:14px}
.t-dots span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.t-dots span.on{background:var(--orange)}

.modal{position:fixed;inset:0;z-index:95;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .2s ease}
.modal-card{background:var(--card);border-radius:28px;padding:24px;width:min(360px,100%);text-align:center;display:grid;gap:12px;justify-items:center}
.modal-card h3{font-family:var(--display);font-size:22px;letter-spacing:-.03em;margin:0}
.empty{padding:56px 16px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:99;max-width:calc(100% - 32px);animation:toast 2.2s ease forwards;text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.plus-badge{display:inline-grid;place-items:center;height:16px;min-width:16px;padding:0 4px;border-radius:5px;background:var(--ink);color:var(--orange);font-family:var(--display);font-size:11px;font-weight:800;margin-left:4px;vertical-align:-2px;line-height:1}
.views{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 6px;color:var(--muted);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.nsfw{font-weight:800;font-size:11px;padding:4px 7px;border-radius:7px;background:var(--ink);color:var(--bg);margin-right:4px}
.cover-wrap{position:relative}
.covered{filter:blur(10px);user-select:none;pointer-events:none}
.cover-btn{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-weight:800;font-size:13.5px}
.cover-btn span{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px}
.mod-err{color:var(--orange);font-weight:700;font-size:13.5px;margin:10px 2px 0}
.mod-err button{color:var(--ink);text-decoration:underline;font-weight:800}
.sticker{font-size:58px;line-height:1.05;display:inline-block;transform:rotate(-5deg);filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.msg.stk{background:transparent!important;padding:4px 6px}
.picker{display:flex;gap:2px;flex-wrap:wrap;background:var(--soft);border-radius:18px;padding:8px;margin-top:8px;max-height:200px;overflow:auto}
.picker .pk{width:100%;font-size:11.5px;font-weight:800;color:var(--muted);padding:4px 6px 0}
.picker button{font-size:28px;width:44px;height:44px;border-radius:12px}
.picker button:hover{background:var(--card)}
.stk-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.tool-on{background:var(--ink)!important;color:var(--bg)!important}
.ring{display:inline-grid;place-items:center;border-radius:50%;flex:none;position:relative}
.ring>.av{border:2px solid var(--card)}
.ring-fire{background:conic-gradient(from var(--spin),#ff2d00,#ff8a2b,#ffd27a,#ff2d00);animation:spin 2.2s linear infinite}
.ring-ice{background:conic-gradient(from var(--spin),#ffffff,#cfd8de,#7f95a6,#ffffff);animation:spin 4s linear infinite}
.ring-gold{background:conic-gradient(from var(--spin),#ffd700,#fff4b0,#b98900,#ffd700);animation:spin 3s linear infinite}
.ring-morph{background:conic-gradient(from var(--spin),var(--orange),var(--orange-2),#ffd27a,var(--orange));animation:morph 6s ease-in-out infinite,spin 3s linear infinite}
.ring-morph>.av{border-radius:inherit}
.ring-glitch{background:linear-gradient(90deg,#ff2d55,#00e5ff,#ff2d55,#00e5ff);background-size:300% 100%;animation:glitch 1s steps(4) infinite}
.ring-plus{background:conic-gradient(from var(--spin),#0a0a0a,var(--orange),#0a0a0a,var(--orange),#0a0a0a);animation:spin 3s linear infinite}
.fx-lava{background:radial-gradient(circle at 20% 30%,#ffd27a,transparent 35%),radial-gradient(circle at 80% 70%,#ff2d00,transparent 40%),radial-gradient(circle at 50% 50%,#ff8a2b,#0a0a0a 85%)!important;background-size:220% 220%!important;animation:drift 7s ease-in-out infinite alternate}
.fx-aurora{background:linear-gradient(115deg,#0a0a0a 10%,#ff5500 35%,#ffd27a 50%,#ff8a2b 65%,#0a0a0a 90%)!important;background-size:300% 300%!important;animation:drift 9s ease-in-out infinite alternate}
.fx-static{background:repeating-radial-gradient(circle at 30% 40%,#151515 0 1px,#2a2a2a 1px 3px),linear-gradient(90deg,#0a0a0a,#ff5500)!important;background-blend-mode:screen;animation:noise .25s steps(3) infinite}
.fx-embers{background:radial-gradient(circle,#ff8a2b 1.6px,transparent 2.2px) 0 0/38px 56px,radial-gradient(circle,#ffd27a 1.1px,transparent 1.7px) 19px 28px/52px 70px,linear-gradient(180deg,#0a0a0a,#3a1204)!important;animation:embers 3.5s linear infinite}
.pts{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 14px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.t-week{font-size:12.5px;font-weight:800;color:var(--muted)}
.t-deg{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.t-level{font-weight:800;color:var(--orange);margin-top:3px}
.t-meta{display:grid;gap:2px;margin-top:8px;font-size:13px;color:var(--muted);font-weight:600}
.bubble{animation:bub 2.6s ease-in infinite;transform-box:fill-box}
.pts-hero{background:var(--card);border-radius:26px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.pts-hero b{font-family:var(--display);font-size:32px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.item{background:var(--card);border-radius:22px;padding:10px;display:grid;gap:10px;align-content:start;min-width:0}
.item .pv{height:96px;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative;font-size:30px}
.item .nm{font-weight:800;padding-inline:4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.item .btn{width:100%}
.plus-hero{background:#0a0a0a;color:#fff;border-radius:28px;padding:24px;margin-top:6px;position:relative;overflow:hidden}
.plus-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;background:conic-gradient(from var(--spin),var(--orange),var(--orange-2),#ffd27a,var(--orange));animation:morph 7s ease-in-out infinite,spin 4s linear infinite;opacity:.9}
.plus-hero h2{font-family:var(--display);font-size:40px;letter-spacing:-.06em;margin:0;position:relative;z-index:1}
.plus-hero h2 span{color:var(--orange)}
.price{font-family:var(--display);font-size:24px;font-weight:700;margin-top:10px;position:relative;z-index:1}
.price span{font-size:14px;opacity:.7;font-family:var(--body)}
.perk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.perk + .perk{border-top:1px solid var(--line)}
.perk .si{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--orange)}
.perk b{display:block;font-weight:800}
.perk span{color:var(--muted);font-size:14px;font-weight:500}
.lb-row{display:flex;align-items:center;gap:12px;padding-block:9px;width:100%;text-align:left}
.lb-row + .lb-row{border-top:1px solid var(--line)}
.lb-rank{font-family:var(--display);font-weight:800;width:18px;text-align:center;flex:none}
.lb-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--orange-2),var(--orange));margin-top:6px}
.lb-deg{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.seg .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;margin-left:6px;padding:0 5px}
@keyframes glitch{0%{background-position:0 0;transform:translate(0)}25%{transform:translate(1px,-1px)}50%{background-position:100% 0;transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}100%{background-position:200% 0;transform:translate(0)}}
@keyframes drift{to{background-position:100% 100%}}
@keyframes noise{33%{background-position:3px 5px,0 0}66%{background-position:-4px 2px,0 0}}
@keyframes embers{to{background-position:0 -56px,19px -42px,0 0}}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-110px);opacity:0}}
.thermo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border-radius:22px;padding:14px 16px;margin-top:14px}
.t-main{flex:1 1 150px;min-width:130px;max-width:260px}
.t-main svg{width:100%;height:auto;display:block;overflow:visible}

const LOOP=8000;
function drawReel(g,w,h,t,seed,text){

  for(let i=0;i<4;i++){
    const ph=r()*6.28, sp=.6+r()*.8;
    const x=w*(.5+.38*Math.sin(p*6.28*sp+ph)), y=h*(.5+.38*Math.cos(p*6.28*sp*.8+ph*1.3)), rad=Math.max(w,h)*(.25+.15*r());
    const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,i%2?d+'dd':'rgba(255,255,255,.35)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,w,h);

  let count=0;const lh=fs*1.18;let y=h*.38-(lines.length*lh)/2;
  lines.forEach(L=>{let x=w*.09;L.split(' ').forEach(wd=>{count++;if(count<=shown){const age=Math.min(1,((t/(LOOP*.55))*words.length-count+1));
      g.globalAlpha=Math.max(0,Math.min(1,age*2));g.fillStyle='#fff';g.fillText(wd,x,y+(1-Math.min(1,age*2))*10)}

  g.globalAlpha=1;
}

const isAdult=s=>ageOf(s.users.me.birth)>=18;
function vis(s,p){
  if(s.blocked[p.userId])return 'hide';
  if(p.userId==='me')return 'show';
  const t=(p.text||'').toLowerCase();
  if(s.settings.muted.some(w=>t.includes(w)))return 'hide';
  const f=p.flags||{},adult=isAdult(s),plus=s.users.me.plus;
  if(p.nsfw&&!(adult&&s.settings.nsfw))return 'hide';
  if(f.slur||f.hate)return 'hide';
  if(f.rape){if(!adult||(plus&&s.settings.hideHate))return 'hide';return plus?'show':'cover'}
  if(f.sexual&&!(adult&&s.settings.nsfw))return 'hide';
  if(f.negative&&plus&&s.settings.hideHate)return 'hide';
  return 'show';
}
const cvis=(s,c)=>vis(s,{userId:c.userId,text:c.text,flags:c.flags});
const visible=(s,p)=>vis(s,p)!=='hide';
const hashStr=str=>[...str].reduce((h,c)=>Math.imul(31,h)+c.charCodeAt(0)|0,7);
function tempOf(s,u){
  const w=u.id==='me'?s.week:(s.temps[u.uid||u.id]||{heat:0,viral:0});
  return Math.min(240,32+(w.heat||0)*6+(w.viral||0)*20);
}

function Avatar({u,size=40,online,noRing}){
  const initials=(u.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  const ringed=u.ring&&!noRing; const inner=ringed?size-6:size;
  let a=html`<div className="av" style=${{width:inner,height:inner,background:u.color,fontSize:inner*.38}}>${u.avatar?html`<img src=${u.avatar} alt="" />`:initials}</div>`;
  if(ringed)a=html`<span className=${'ring ring-'+u.ring} style=${{width:size,height:size}}>${a}</span>`;
  return online?html`<span className="av-wrap">${a}<span className="online"></span></span>`:a;
}

const Check=({u})=>html`${u.verified&&html`<span className="verified" aria-label="Verified"><${Icon} n="check" s=${11} w=${3.4}/></span>`}${u.plus&&html`<span className="plus-badge" aria-label="Temp+">+</span>`}`;
function Rich({text,onTag}){
  const parts=(text||'').split(/(#[\w]+|@[\w.]+)/g);
  return parts.map((t,i)=>/^[#@]/.test(t)?html`<button key=${i} className="tag" onClick=${e=>{e.stopPropagation();onTag&&onTag(t)}}>${t}</button>`:t);
}
function Sheet({onClose,children,label}){
  useEffect(()=>{const k=e=>{if(e.key==='Escape')onClose()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
  return html`<div className="scrim" onClick=${onClose}><div className="sheet" role="dialog" aria-label=${label} onClick=${e=>e.stopPropagation()}><div className="grab"></div>${children}</div></div>`;
}

function Timer({p,now}){
  const tag=p.tour?'state-'+p.tour:null;
  if(p.status==='normal')return null;
  if(p.status==='frozen')return html`<span className="timer frozen" data-tour=${tag}><${Icon} n="snow" s=${14} w=${2.4}/>Frozen</span>`;
  if(p.status==='kept')return html`<span className="timer burning" data-tour=${tag}><${Icon} n="pin" s=${14} w=${2.4}/>Kept</span>`;
  const hot=p.status==='burning'||p.status==='gone';
  return html`<span className="timer burning" data-tour=${tag}><${Icon} n="flame" s=${14} w=${2.4}/>${hms(p.burnEnds-now)}</span>`;
}

function Post({p,s,dispatch,open}){
  const u=s.users[p.userId];
  const [burst,setBurst]=useState(0);const [reveal,setReveal]=useState(false);const ref=useRef();
  const t=p.tour;
  useEffect(()=>{const el=ref.current;if(!el||s.viewed[p.id])return;
    const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){dispatch({type:'view',id:p.id});io.disconnect()}},{threshold:.5});io.observe(el);return()=>io.disconnect()},[]);
  const heat=()=>dispatch({type:'heat',id:p.id});
  const dbl=()=>{if(!p.myHeat)heat();setBurst(Date.now())};
  const cs=p.comments.filter(c=>cvis(s,c)==='show');
  const live=p.status==='burning'||p.status==='gone';const frozen=p.status==='frozen';
  const pct=live?Math.max(0,Math.min(1,(p.burnEnds-s.now)/DAY)):0;
  const top=cs.length?[...cs].sort((a,b)=>b.likes-a.likes)[0]:null;
  const counts=!s.settings.hideCounts||p.userId==='me';
  const covered=vis(s,p)==='cover'&&!reveal;
  return html`<article ref=${ref} className=${'post'+(p.status==='gone'?' gone':'')+(frozen?' is-frozen':'')} data-tour=${t?'post-'+t:null}>
    <div className="p-head">
      <button onClick=${()=>open.profile(u.id)} aria-label=${'Open @'+u.handle}><${Avatar} u=${u}/></button>
      <button className="p-id" onClick=${()=>open.profile(u.id)}>
        <span className="p-name">${u.name}<${Check} u=${u}/></span><span className="p-sub">@${u.handle} · ${ago(s.now-p.createdAt)}</span></button>
      <div className="p-right">${p.nsfw&&html`<span className="nsfw">18+</span>`}<${Timer} p=${p} now=${s.now}/>
        <button className="p-more" aria-label="Post options" data-tour=${t?'more-'+t:null} onClick=${()=>open.menu(p.id)}><${Icon} n="more" s=${20}/></button></div>
    </div>
    <div className="cover-wrap">
      <div className=${covered?'covered':''}>
        ${p.text&&html`<p className=${'p-text'+(!p.media&&p.text.length<90?' big':'')}><${Rich} text=${p.text} onTag=${open.search}/></p>`}
        ${p.media&&html`<div className="media" onDoubleClick=${dbl}>
            ${p.media.type==='video'?html`<video src=${p.media.url} controls playsInline muted loop autoPlay=${s.settings.autoplay&&!s.settings.dataSaver}></video>`:html`<img src=${p.media.url} alt="" draggable="false" />`}
            ${p.media.gif&&html`<span className="gif-tag">GIF</span>`}
            ${burst>0&&Date.now()-burst<950&&html`<div className="burst" key=${burst}><svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" dangerouslySetInnerHTML=${{__html:P.flame}}></svg></div>`}
          </div>`}
      </div>
      ${covered&&html`<button className="cover-btn" onClick=${()=>setReveal(true)}><span>Strong language · Tap to view</span></button>`}
    </div>
    <div className="p-actions">
      <button className=${'react heat'+(p.myHeat?' on':'')} aria-pressed=${p.myHeat} aria-label="Heat" data-tour=${t?'heat-'+t:null} onClick=${heat}><${Icon} n="flame" s=${19} w=${2.2} fill=${p.myHeat?'currentColor':null}/>${counts?kfmt(p.heat):''}</button>
      <button className=${'react freeze'+(p.myFreeze?' on':'')} aria-pressed=${p.myFreeze} aria-label="Freeze" data-tour=${t?'freeze-'+t:null} onClick=${()=>dispatch({type:'freeze',id:p.id})}><${Icon} n="snow" s=${19} w=${2.2}/>${counts?kfmt(p.freeze):''}</button>
      <div className="social" data-tour=${t?'social-'+t:null}>
        <button className="ic" aria-label=${frozen?'Comments are off while frozen':'Comments'} disabled=${frozen} onClick=${()=>open.comments(p.id)}><${Icon} n="comment" s=${21}/><span className="n">${cs.length||''}</span></button>
        <button className="ic" aria-label="Send" onClick=${()=>open.share(p.id)}><${Icon} n="share" s=${20}/></button>
        <button className=${'ic'+(p.saved?' on':'')} aria-pressed=${p.saved} aria-label="Save" onClick=${()=>dispatch({type:'save',id:p.id})}><${Icon} n="save" s=${20} fill=${p.saved?'currentColor':null}/></button>
        <span className="views" aria-label=${kfmt(p.views||0)+' views'}><${Icon} n="views" s=${17} w=${2.2}/>${kfmt(p.views||0)}</span>
      </div>
    </div>
    ${top&&!frozen&&html`<button className="p-comments" onClick=${()=>open.comments(p.id)}><b>${s.users[top.userId].handle}</b> ${top.sticker?stickerLabel(top.sticker):top.text}${cs.length>1?' · View all '+cs.length:''}</button>`}
    ${live&&html`<div className="life burning" style=${{width:pct*100+'%'}}></div>`}
  </article>`;
}

function StoriesRow({s,open,addStory}){
  const mine=s.stories.find(x=>x.userId==='me');
  const others=s.stories.filter(x=>x.userId!=='me'&&!s.blocked[x.userId]);
  const unseen=st=>st.items.some(i=>!s.seen[i.id]);
  const sorted=[...others].sort((a,b)=>unseen(b)-unseen(a));
  return html`<div className="stories" aria-label="Stories" data-tour="stories">
    <div className="story">
      <button className=${'orb'+(s.storyUploading?' uploading':mine&&unseen(mine)?'':' seen')} onClick=${()=>mine?open.story('me'):addStory()} aria-label=${s.storyUploading?'Your story is uploading':mine?'Your story':'Add to your story'}>
        <${Avatar} u=${s.users.me} size=${68} noRing=${true}/>
        ${s.storyUploading?html`<span className="up-spin" aria-hidden="true"></span>`:null}

const STORY_REACTS=['🔥','😂','😮','🧊'];
function StoryViewer({s,startUser,dispatch,onClose,onAdd}){
  const order=[...(s.stories.find(x=>x.userId==='me')?['me']:[]),...s.stories.filter(x=>x.userId!=='me'&&!s.blocked[x.userId]).map(x=>x.userId)];
  const [ui,setUi]=useState(Math.max(0,order.indexOf(startUser)));
  const [ii,setIi]=useState(0);
  const [prog,setProg]=useState(0);
  const [hold,setHold]=useState(0);const [dragY,setDragY]=useState(0);const vid=useRef();const g=useRef({});
  const [text,setText]=useState('');
  const [picker,setPicker]=useState(false);
  const [panel,setPanel]=useState(false);
  const st=s.stories.find(x=>x.userId===order[ui]);
  const item=st&&st.items[ii];
  const paused=hold>0||text.length>0||picker||panel;
  useEffect(()=>{if(item)dispatch({type:'seen',id:item.id});setPicker(false);setPanel(false);setText('');setHold(0)},[item&&item.id]);
  useEffect(()=>{if(!hold)return;const t=setTimeout(()=>setHold(hold-1),1000);return()=>clearTimeout(t)},[hold]);
  useEffect(()=>{const v=vid.current;if(!v)return;try{paused?v.pause():v.play().catch(()=>{})}catch(e){}},[paused]);
  function replay(){setProg(0);const v=vid.current;if(v){v.currentTime=0;if(!paused)v.play().catch(()=>{})}}
  // tap left = replay, tap right = next, hold = pause (15s countdown), swipe down = close
  function down(e){g.current={x:e.clientX,y:e.clientY,moved:false,held:false,id:e.pointerId,t:setTimeout(()=>{g.current.held=true;setHold(15)},220)};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}}
  function move(e){const d=g.current;if(d.x==null)return;const dy=e.clientY-d.y,dx=e.clientX-d.x;if(dy>8&&dy>Math.abs(dx)){d.moved=true;clearTimeout(d.t);setDragY(dy)}}
  function up(e){const d=g.current;if(d.x==null)return;clearTimeout(d.t);g.current={};
    if(d.moved){const dy=e.clientY-d.y;if(dy>120){onClose();return}setDragY(0);setHold(0);return}
    if(d.held){setHold(0);return}
    const r=e.currentTarget.getBoundingClientRect();if(e.clientX-r.left<r.width*.35)replay();else next()}
  function cancel(){clearTimeout(g.current.t);g.current={};setDragY(0);setHold(0)}
  function next(){if(!st)return onClose();if(ii<st.items.length-1){setIi(ii+1)}else if(ui<order.length-1){setUi(ui+1);setIi(0)}else onClose();setProg(0)}
  function prev(){if(ii>0)setIi(ii-1);else if(ui>0){setUi(ui-1);setIi(0)}setProg(0)}
  useEffect(()=>{if(paused)return;const t=setInterval(()=>setProg(p=>Math.min(1,p+0.02)),100);return()=>clearInterval(t)},[ui,ii,paused]);
  useEffect(()=>{if(prog>=1)next()},[prog]);
  useEffect(()=>{const k=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape')onClose();if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)});
  if(!st||!item)return null;
  const u=s.users[st.userId];const mine=st.userId==='me';
  const comments=(item.comments||[]).filter(c=>!s.blocked[c.userId]);
  const reacts=item.reacts||{};const totalReacts=STORY_REACTS.reduce((n,e)=>n+(reacts[e]||0),0);
  const sendComment=()=>{const t=text.trim();if(!t)return;dispatch({type:'storyComment',id:item.id,text:t});setText('');setPanel(true)};
  const react=e=>{dispatch({type:'storyReact',id:item.id,emoji:e});setPicker(false)};
  const stop=e=>e.stopPropagation();
  return html`<div className="sv" role="dialog" aria-label="Story" style=${{background:dragY?'rgba(0,0,0,'+Math.max(.3,1-dragY/600)+')':undefined}}>
    <div className="sv-in" style=${dragY?{transform:'translateY('+dragY+'px)',transition:'none'}:{transition:'transform .2s ease'}}>
      <div className="sv-media">${item.type==='video'?html`<video ref=${vid} key=${item.id} src=${item.url} autoPlay muted playsInline></video>`:html`<img src=${item.url} alt="" />`}</div>
      <div className="sv-bars">${st.items.map((it,i)=>html`<div key=${it.id}><span style=${{width:(i<ii?1:i===ii?prog:0)*100+'%'}}></span></div>`)}</div>
      <div className="sv-head"><${Avatar} u=${u} size=${32}/><span>${u.handle} <span className="t">${item.uploading?'Posting…':ago(s.now-item.at)}</span></span>
        <div className="sv-btns">
          ${mine&&html`<button className="sv-close" onClick=${onAdd} aria-label="Add to your story"><${Icon} n="plus"/></button>`}
          <button className="sv-close" onClick=${onClose} aria-label="Close"><${Icon} n="x"/></button></div></div>
      <div className="sv-touch" role="button" tabIndex="-1" aria-label="Tap left to replay, right for next, hold to pause, swipe down to close"
        onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${cancel} onContextMenu=${e=>e.preventDefault()}></div>
      ${hold>0&&html`<div className="sv-count" aria-live="polite">${hold}</div>`}
      <div className="sv-foot" onPointerDown=${stop}>
        ${item.caption&&html`<p className="sv-cap">${item.caption}</p>`}
        ${panel&&html`<div className="sv-panel" role="region" aria-label="Story comments">
          <div className="sv-panel-head"><b>${comments.length?comments.length+(comments.length===1?' comment':' comments'):'No comments yet'}</b>
            <button onClick=${()=>setPanel(false)} aria-label="Hide comments"><${Icon} n="x" s=${18}/></button></div>
          <div className="sv-list">${comments.map(c=>{const cu=s.users[c.userId]||{};return html`<div className="sv-c" key=${c.id}><${Avatar} u=${cu} size=${28}/>
            <div><b>${cu.handle}</b> <span className="t">${ago(s.now-c.at)}</span><p>${c.text}</p></div></div>`})}</div>
        </div>`}
        ${mine&&totalReacts>0&&html`<div className="sv-tally">${STORY_REACTS.filter(e=>reacts[e]).map(e=>html`<span key=${e}>${e} ${reacts[e]}</span>`)}</div>`}
        ${picker&&html`<div className="sv-picker" role="group" aria-label="Reactions">${STORY_REACTS.map(e=>html`<button key=${e} className=${item.myReact===e?'on':''} aria-pressed=${item.myReact===e} onClick=${()=>react(e)} aria-label=${'React '+e}>${e}</button>`)}</div>`}
        <div className="sv-bar">
          <div className="sv-input"><label htmlFor="sv-comment" className="vh">Comment</label>
            <input id="sv-comment" placeholder=${mine?'Reply to comments…':'Add a comment…'} value=${text} maxLength=${300} onChange=${e=>setText(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&sendComment()}/>
            ${text.trim()&&html`<button className="send" onClick=${sendComment} aria-label="Post comment"><${Icon} n="share" s=${18}/></button>`}</div>
          <button className="sv-round" onClick=${()=>{setPanel(!panel);setPicker(false)}} aria-label="Comments" aria-pressed=${panel}><${Icon} n="comment" s=${22}/>${comments.length?html`<span className="sv-n">${comments.length}</span>`:null}</button>
          ${!mine&&html`<button className=${'sv-round'+(item.myReact?' reacted':'')} onClick=${()=>{setPicker(!picker);setPanel(false)}} aria-label="React" aria-expanded=${picker}>${item.myReact?html`<span style=${{fontSize:22}}>${item.myReact}</span>`:html`<${Icon} n="heart" s=${22}/>`}</button>`}
        </div>
      </div>
    </div>
  </div>`;
}

      const dur=Math.max(1,Math.min(REC_MAX,(Date.now()-t0.current)/1000));stopStream();
      const ext=type.includes('mp4')?'mp4':'webm';const file=new File([blob],(mode==='story'?'story.':'replay.')+ext,{type});

  const post=()=>{
    const why=MOD.rules(MOD.classify(caption+' '+text),s.users.me.plus,isAdult(s));if(why){setErr(why.msg);return}
    const overlay={filter,text:text.trim(),textPos:pos,color,trimStart:+ts.toFixed(1),trimEnd:+te.toFixed(1),dur:+clip.dur.toFixed(1)};

        <div className="sv-btns"><button className="sv-close" onClick=${onClose} aria-label="Discard"><${Icon} n="x"/></button></div></div>

function ReelClip({p,active,paused,runKey,onEnd}){
  const cv=useRef(),vd=useRef();const [prog,setProg]=useState(0);

    if(p.clip.kind!=='art')return;
    const c=cv.current;if(!c)return;const g=c.getContext('2d');
    const fit=()=>{const r=c.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d)};fit();
    drawReel(g,c.width,c.height,LOOP*.7,p.clip.seed,p.text);setProg(0);
    if(!active)return;
    let raf,acc=0,last=performance.now();
    const step=now=>{const dt=now-last;last=now;if(!paused.current)acc+=dt;
      if(acc>=LOOP)acc=0;
      drawReel(g,c.width,c.height,acc,p.clip.seed,p.text);setProg(acc/LOOP);raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);addEventListener('resize',fit);
    return()=>{cancelAnimationFrame(raf);removeEventListener('resize',fit)};
  },[active,runKey]);
  useEffect(()=>{
    if(p.clip.kind!=='video')return;const v=vd.current;if(!v)return;
    const o=p.overlay||{};const t0=o.trimStart||0;
    const t1=()=>o.trimEnd||v.duration||0;
    const tu=()=>{const e=t1();setProg(e>t0?(v.currentTime-t0)/(e-t0):0);if(o.trimEnd&&v.currentTime>=o.trimEnd){v.currentTime=t0;v.play().catch(()=>{})}};
    const end=()=>{v.currentTime=t0;setProg(0);v.play().catch(()=>{})};
    v.addEventListener('timeupdate',tu);v.addEventListener('ended',end);
    if(active){if(v.ended||v.currentTime<t0||(o.trimEnd&&v.currentTime>=o.trimEnd))v.currentTime=t0;v.play().catch(()=>{})}else{v.pause();v.currentTime=t0}
    return()=>{v.removeEventListener('timeupdate',tu);v.removeEventListener('ended',end)};
  },[active,runKey]);
  return html`${p.clip.kind==='art'?html`<canvas ref=${cv} aria-label=${p.text}></canvas>`:html`<video ref=${vd} src=${p.clip.url} muted playsInline></video>`}
    <${ReplayOverlay} o=${p.overlay}/>
    <div className="reel-prog"><div style=${{width:prog*100+'%'}}></div></div>`;
}

function Reel({p,s,active,dispatch,open}){
  const u=s.users[p.userId];const paused=useRef(false);const [pz,setPz]=useState(false);const [burst,setBurst]=useState(0);
  const [ended,setEnded]=useState(false);const [runKey,setRunKey]=useState(0);const [manual,setManual]=useState(false);
  const lastTap=useRef(0);
  const vid=()=>document.querySelector(`[data-reel="${p.id}"] video`);
  const togglePause=()=>{paused.current=!paused.current;setPz(paused.current);const v=vid();if(v){paused.current?v.pause():v.play().catch(()=>{})}};
  const restart=()=>{setEnded(false);paused.current=false;setPz(false);setRunKey(k=>k+1)};
  const tap=()=>{const now=Date.now();
    if(now-lastTap.current<300){if(!p.myHeat)dispatch({type:'heat',id:p.id});setBurst(now)}
    else setTimeout(()=>{if(lastTap.current===now){ended?restart():togglePause()}},300);
    lastTap.current=now};
  useEffect(()=>{if(!active){paused.current=false;setPz(false);setEnded(false)}},[active]);
  const counts=!s.settings.hideCounts||p.userId==='me';
  const running=active&&(s.settings.autoplay&&!s.settings.dataSaver||manual);
  return html`<section className=${'reel'+(p.status==='frozen'?' is-frozen':'')} data-reel=${p.id} data-id=${p.id}>
    <div className="reel-in">
      <div style=${{position:'absolute',inset:0}} onClick=${()=>{if(!running){setManual(true);return}tap()}}>
        <${ReelClip} p=${p} active=${running} paused=${paused} runKey=${runKey} onEnd=${()=>setEnded(true)}/>
      </div>
      <div className="reel-shade"></div>
      ${(pz||ended||!running)&&html`<div className="reel-pause"><span><${Icon} n=${ended?'replay':'play'} s=${30} w=${ended?2.4:1.9} fill=${ended?null:'#fff'}/></span></div>`}
      ${burst>0&&Date.now()-burst<950&&html`<div className="burst" key=${burst}><svg width="140" height="140" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" dangerouslySetInnerHTML=${{__html:P.flame}}></svg></div>`}
      <div className="reel-info">
        <div className="reel-who"><button onClick=${()=>open.profile(u.id)}><${Avatar} u=${u} size=${36}/></button>
          <button onClick=${()=>open.profile(u.id)} style=${{display:'flex',alignItems:'center'}}>${u.handle}<${Check} u=${u}/></button>
          ${u.id!=='me'&&!u.following&&html`<button className="btn" onClick=${()=>dispatch({type:'follow',id:u.id})}>Follow</button>`}</div>
        <div className="reel-cap"><${Rich} text=${p.text} onTag=${open.search}/></div>
      </div>
      <div className="reel-rail">
        <button className=${'rail-btn'+(p.myHeat?' on':'')} onClick=${()=>dispatch({type:'heat',id:p.id})} aria-label="Heat"><span className="rb"><${Icon} n="flame" s=${24} w=${2.2} fill=${p.myHeat?'currentColor':null}/></span>${counts?p.heat:''}</button>
        <button className=${'rail-btn ice'+(p.myFreeze?' on':'')} onClick=${()=>dispatch({type:'freeze',id:p.id})} aria-label="Freeze"><span className="rb"><${Icon} n="snow" s=${24} w=${2.2}/></span>${counts?p.freeze:''}</button>
        <button className="rail-btn" disabled=${p.status==='frozen'} onClick=${()=>open.comments(p.id)} aria-label="Comments"><span className="rb"><${Icon} n="comment" s=${23}/></span>${p.comments.length}</button>
        <button className=${'rail-btn rp'+(p.myRepost?' on':'')} disabled=${p.userId==='me'} onClick=${()=>dispatch({type:'repost',id:p.id})} aria-label=${p.myRepost?'Undo repost':'Repost'}><span className="rb"><${Icon} n="repost" s=${23} w=${2.2}/></span>${kfmt(p.reposts||0)}</button>
        <button className="rail-btn" onClick=${()=>open.share(p.id)} aria-label="Send"><span className="rb"><${Icon} n="share" s=${22}/></span></button>
        <button className=${'rail-btn'+(p.saved?' on':'')} onClick=${()=>dispatch({type:'save',id:p.id})} aria-label="Save"><span className="rb"><${Icon} n="save" s=${22} fill=${p.saved?'currentColor':null}/></span></button>
      </div>
    </div>
  </section>`;
}

function Replay({s,dispatch,open,startId}){
  const reels=s.posts.filter(p=>p.reel&&p.status!=='gone'&&visible(s,p));
  const box=useRef();const [active,setActive]=useState(startId||(reels[0]&&reels[0].id));
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)setActive(+e.target.dataset.id)}),{root:box.current,threshold:[.6]});
    box.current.querySelectorAll('.reel').forEach(el=>io.observe(el));
    if(startId){const el=box.current.querySelector(`[data-id="${startId}"]`);if(el)el.scrollIntoView()}
    return()=>io.disconnect();
  },[reels.length]);
  const sw=useRef(null);
  return html`<div className="reels" ref=${box} onTouchStart=${e=>{const t=e.touches[0];sw.current={x:t.clientX,y:t.clientY}}} onTouchEnd=${e=>{const a=sw.current;sw.current=null;if(!a)return;const t=e.changedTouches[0];const dx=t.clientX-a.x,dy=t.clientY-a.y;if(dx<-70&&Math.abs(dx)>Math.abs(dy)*2)open.leaveReplay()}}>
    <div className="reel-top" style=${{position:'fixed',maxWidth:520,margin:'0 auto',color:'#fff'}}><h2>Replay</h2>
      <button className="circle" style=${{background:'rgba(255,255,255,.14)',color:'#fff'}} aria-label="New Replay" onClick=${()=>open.compose(true)}><${Icon} n="camera"/></button></div>
    ${reels.map(p=>html`<${Reel} key=${p.id} p=${p} s=${s} active=${active===p.id} dispatch=${dispatch} open=${open}/>`)}
    ${!reels.length&&html`<div className="empty" style=${{color:'#fff',paddingTop:'40vh'}}>Nothing to replay</div>`}
  </div>`;
}

const GIPHY_KEY='b2Iegy5NrTJZ6CeatyDooV0oumjBTBYH';
async function giphy(q){
  const base='https://api.giphy.com/v1/gifs/'+(q?'search':'trending');
  const u=base+'?api_key='+GIPHY_KEY+'&limit=30&rating=pg-13&bundle=messaging_non_clips'+(q?'&q='+encodeURIComponent(q):'');
  const r=await fetch(u);if(!r.ok)throw new Error('GIF search isn’t available right now.');
  const j=await r.json();
  return (j.data||[]).map(g=>({id:g.id,title:g.title,thumb:(g.images.fixed_width_small||g.images.fixed_width).url,
    url:(g.images.downsized_medium||g.images.downsized||g.images.original).url,w:+g.images.fixed_width.width,h:+g.images.fixed_width.height}));
}
function GifPicker({onPick,onClose}){
  const [q,setQ]=useState('');const [list,setList]=useState([]);const [busy,setBusy]=useState(true);const [err,setErr]=useState('');
  useEffect(()=>{let live=true;setBusy(true);const t=setTimeout(()=>{giphy(q.trim()).then(l=>{if(live){setList(l);setErr('')}}).catch(e=>{if(live)setErr(e.message)}).finally(()=>{if(live)setBusy(false)})},q?350:0);
    return()=>{live=false;clearTimeout(t)}},[q]);
  return html`<div className="gifp" role="dialog" aria-label="Search GIFs">
    <div className="gifp-head"><div className="inputbar" style=${{flex:1,marginTop:0}}><${Icon} n="search" s=${18}/><label htmlFor="gif-q" className="vh">Search GIFs</label>
      <input id="gif-q" autoFocus placeholder="Search GIPHY" value=${q} onChange=${e=>setQ(e.target.value)}/></div>
      ${onClose&&html`<button className="icon-btn" onClick=${onClose} aria-label="Close GIFs"><${Icon} n="x" s=${18}/></button>`}</div>
    <div className="gifp-grid">${list.map(g=>html`<button key=${g.id} onClick=${()=>onPick(g)} aria-label=${g.title||'GIF'}><img src=${g.thumb} alt="" loading="lazy" style=${{aspectRatio:g.w&&g.h?g.w+'/'+g.h:'1'}}/></button>`)}</div>
    ${busy&&!list.length&&html`<p className="sub" style=${{textAlign:'center'}}>Loading…</p>`}
    ${!busy&&!list.length&&html`<p className="sub" style=${{textAlign:'center'}}>${err||'No GIFs found'}</p>`}
    <p className="gifp-credit">Powered by GIPHY</p>
  </div>`;
}
function Sticker({v,size=58}){
  if(!v)return null;
  if(v.startsWith('T|')){const [,t,c]=v.split('|');const rot=(Math.abs(hashStr(t))%9)-4;
    return html`<span className=${'tsticker ts-'+(c||'o')} style=${{'--r':rot+'deg',fontSize:Math.max(10,size*.27)}}>${t}</span>`}
  if(v.startsWith('G|'))return html`<img className="gsticker" src=${v.slice(2)} alt="GIF" loading="lazy"/>`;
  if(v.startsWith('I|'))return html`<img className="isticker" src=${v.slice(2)} alt="Sticker" style=${{width:size*1.2,height:size*1.2}}/>`;
  return html`<span className="sticker" style=${{fontSize:size}}>${v}</span>`;
}
const stickerLabel=v=>!v?'':v.startsWith('G|')?'a GIF':v.startsWith('T|')?'“'+v.split('|')[1]+'” sticker':v.startsWith('I|')?'a sticker':v+' sticker';

function BarsOnScroll({on}){
  useEffect(()=>{const b=document.body;if(!on){b.classList.remove('bars-off');return}
    let last=scrollY;const f=()=>{const y=scrollY,dy=y-last;last=y;if(y<40)b.classList.remove('bars-off');else if(dy>6)b.classList.add('bars-off');else if(dy<-6)b.classList.remove('bars-off')};
    addEventListener('scroll',f,{passive:true});return()=>{removeEventListener('scroll',f);b.classList.remove('bars-off')}},[on]);
  return null;
}

function Auth(){
  const [mode,setMode]=useState('signup');
  const [f,setF]=useState({name:'',handle:'',email:'',pw:'',birth:''});
  const [err,setErr]=useState('');const [note,setNote]=useState('');const [busy,setBusy]=useState(false);
  const up=(k,v)=>{setF({...f,[k]:v});setErr('')};
  const go=m=>{setMode(m);setErr('');setNote('')};
  const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  async function submit(e){
    e.preventDefault();if(busy)return;setErr('');setNote('');
    const email=f.email.trim().toLowerCase();
    try{
      setBusy(true);
      if(mode==='signup'){
        const handle=f.handle.trim().toLowerCase().replace(/^@/,'');
        if(!f.name.trim())return setErr('Enter your name.');
        if(!/^[a-z0-9._]{3,20}$/.test(handle))return setErr('Usernames are 3–20 letters, numbers, dots or underscores.');
        if(!emailOk(email))return setErr('Enter a valid email.');
        if(!f.birth)return setErr('Enter your birthday.');
        const age=(Date.now()-new Date(f.birth))/31557600000;if(!(age>=13))return setErr('You need to be 13 or older to use Temp.');
        if(f.pw.length<8)return setErr('Passwords need at least 8 characters.');
        const {data:free,error:e1}=await sb.rpc('handle_available',{h:handle});if(e1)throw e1;
        if(!free)return setErr(`@${handle} is taken. Try another.`);
        const {data,error}=await sb.auth.signUp({email,password:f.pw,options:{data:{name:f.name.trim(),handle,birth:f.birth},emailRedirectTo:location.origin+location.pathname}});
        if(error){if(/registered|exists/i.test(error.message))return setErr('That email already has an account. Sign in instead.');if(/database error/i.test(error.message))return setErr('Couldn’t create that account. Try a different username.');throw error}
        if(!data.session){setMode('signin');setNote(`Check ${email} for a link to confirm your account, then sign in.`)}
      } else if(mode==='signin'){
        if(!emailOk(email)||!f.pw)return setErr('Enter your email and password.');
        const {error}=await sb.auth.signInWithPassword({email,password:f.pw});
        if(error)return setErr(/confirm/i.test(error.message)?'Confirm your email first. Check your inbox for the link.':'That email and password don’t match.');
      } else {
        if(!emailOk(email))return setErr('Enter a valid email.');
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        setNote(`If ${email} has an account, a reset link is on its way.`);
      }
    }catch(x){setErr(friendly(x))}finally{setBusy(false)}
  }
  return html`<div className="welcome"><div className="welcome-in">
    <div className="w-hero"><h1 className="w-mark">temp<i></i></h1><div className="w-orbs"><span></span><span></span><span></span></div></div>
    <form className="w-form" onSubmit=${submit} noValidate>
      ${mode!=='forgot'?html`<div className="seg" role="group" aria-label="Account" style=${{marginBottom:6}}>
          <button type="button" aria-pressed=${mode==='signup'} onClick=${()=>go('signup')}>Sign up</button>
          <button type="button" aria-pressed=${mode==='signin'} onClick=${()=>go('signin')}>Sign in</button></div>`
        :html`<h2 className="top-title" style=${{fontSize:22,margin:'0 0 4px'}}>Reset password</h2>`}
      ${mode==='signup'&&html`
        <div className="field"><label htmlFor="a-name">Name</label><input id="a-name" autoComplete="name" value=${f.name} onChange=${e=>up('name',e.target.value)} maxLength=${40}/></div>
        <div className="field"><label htmlFor="a-handle">Username</label><input id="a-handle" autoComplete="username" autoCapitalize="none" value=${f.handle} onChange=${e=>up('handle',e.target.value.replace(/\s/g,''))} maxLength=${21}/></div>`}
      <div className="field"><label htmlFor="a-email">Email</label><input id="a-email" type="email" autoComplete="email" autoCapitalize="none" value=${f.email} onChange=${e=>up('email',e.target.value)}/></div>
      ${mode==='signup'&&html`<div className="field"><label htmlFor="a-birth">Birthday</label><input id="a-birth" type="date" autoComplete="bday" value=${f.birth} onChange=${e=>up('birth',e.target.value)}/></div>`}
      ${mode!=='forgot'&&html`<${PwField} id="a-pw" label="Password" auto=${mode==='signup'?'new-password':'current-password'} value=${f.pw} onChange=${v=>up('pw',v)}/>`}
      ${mode==='signin'&&html`<button type="button" className="a-link" onClick=${()=>go('forgot')}>Forgot password?</button>`}
      ${err&&html`<p className="a-err" role="alert">${err}</p>`}
      ${note&&html`<p className="a-note" role="status">${note}</p>`}
      <button type="submit" className="btn orange wide" disabled=${busy} style=${{marginTop:18}}>${busy?'One sec…':mode==='signup'?'Create account':mode==='signin'?'Sign in':'Send reset link'}</button>
      ${mode==='forgot'&&html`<button type="button" className="a-link" style=${{justifySelf:'center',marginTop:10}} onClick=${()=>go('signin')}>Back to sign in</button>`}
    </form>
  </div></div>`;
}

function Tour({s,ids,step,setStep,onEnd}){
  const steps=makeSteps(s,ids);
  const st=steps[step];
  const [rect,setRect]=useState(null);
  const [vp,setVp]=useState({w:innerWidth,h:innerHeight});
  const cardRef=useRef();const [ch,setCh]=useState(200);
  const done=st.done?st.done():false;
  useEffect(()=>{
    if(!st.target){setRect(null);return}
    const el=document.querySelector(`[data-tour="${st.target}"]`);
    if(!el){setRect(null);return}
    const r0=el.getBoundingClientRect();
    if(!st.target.startsWith('nav-')&&st.target!=='notifs'){
      const isPost=st.target.startsWith('post');
      if(isPost||r0.top<120||r0.bottom>innerHeight-220)scrollTo({top:Math.max(0,scrollY+r0.top-(isPost?120:Math.max(160,innerHeight*.3))),behavior:'smooth'})}
    else if(st.target==='notifs')scrollTo({top:0,behavior:'smooth'});
    let raf;const loop=()=>{const e=document.querySelector(`[data-tour="${st.target}"]`);
      if(e){const r=e.getBoundingClientRect();setRect(p=>p&&Math.abs(p.top-r.top)<.5&&Math.abs(p.left-r.left)<.5&&Math.abs(p.width-r.width)<.5&&Math.abs(p.height-r.height)<.5?p:{top:r.top,left:r.left,width:r.width,height:r.height})}
      setVp(v=>v.w===innerWidth&&v.h===innerHeight?v:{w:innerWidth,h:innerHeight});
      raf=requestAnimationFrame(loop)};
    loop();return()=>cancelAnimationFrame(raf);
  },[step,st.target]);
  useLayoutEffect(()=>{if(cardRef.current&&cardRef.current.offsetHeight!==ch)setCh(cardRef.current.offsetHeight)});
  useEffect(()=>{if(st.done&&done){const t=setTimeout(()=>setStep(step+1),800);return()=>clearTimeout(t)}},[done,step]);
  useEffect(()=>{const k=e=>{if(e.key==='Escape')onEnd()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
  const pad=6;
  let dims=null,card={};
  if(rect){
    const x=Math.max(4,rect.left-pad),y=Math.max(4,rect.top-pad),w=Math.min(vp.w-8,rect.width+pad*2),h=Math.min(rect.height+pad*2,vp.h-8);
    const round=st.target.startsWith('post')||st.target==='stories'?30:st.target==='nav-create'?18:999;
    const R=Math.min(round,w/2,h/2),W=vp.w,H=vp.h;
    const d=`M0 0H${W}V${H}H0Z M${x+R} ${y}H${x+w-R}A${R} ${R} 0 0 1 ${x+w} ${y+R}V${y+h-R}A${R} ${R} 0 0 1 ${x+w-R} ${y+h}H${x+R}A${R} ${R} 0 0 1 ${x} ${y+h-R}V${y+R}A${R} ${R} 0 0 1 ${x+R} ${y}Z`;
    const clip=`path(evenodd, '${d}')`;
    dims=html`
      <div className="tour-dim" style=${{inset:0,clipPath:clip,WebkitClipPath:clip}}></div>
      <div className="tour-ring" style=${{left:x,top:y,width:w,height:h,borderRadius:R}}></div>`;
    const cw=Math.min(340,vp.w-32);
    const below=y+h+14+ch<vp.h-16, above=y-14-ch>16;
    card={left:Math.min(Math.max(16,x+w/2-cw/2),vp.w-cw-16),top:below?y+h+14:above?y-14-ch:Math.max(16,vp.h-ch-16)};
  }
  return html`<div className="tour" role="dialog" aria-label="Tutorial">
    ${rect?dims:html`<div className="tour-dim" style=${{inset:0}}></div>`}
    <div ref=${cardRef} className=${'tour-card'+(rect?'':' center')} style=${card} key=${step}>
      <div className="t-step">${step+1}/${steps.length}</div>
      <h2 className="t-title">${st.title}</h2>
      <p className="t-body">${st.body}</p>
      ${st.try&&html`<div className=${'t-try'+(done?' done':'')}>${done?'Nice.':st.try}</div>`}
      <div className="t-dots">${steps.map((_,i)=>html`<span key=${i} className=${i<=step?'on':''}></span>`)}</div>
      <div className="t-foot">
        ${st.last?html`<span></span>`:html`<button className="t-skip" onClick=${onEnd}>Skip</button>`}
        <div style=${{display:'flex',gap:8}}>
          ${step>0&&!st.last&&html`<button className="btn ghost" onClick=${()=>setStep(step-1)}>Back</button>`}
          ${st.last?html`<button className="btn orange" onClick=${onEnd}>Let’s go</button>`
            :st.try&&!done?html`<button className="btn ghost" onClick=${()=>setStep(step+1)}>Skip step</button>`
            :html`<button className="btn orange" onClick=${()=>setStep(step+1)}>Next</button>`}
        </div>
      </div>
    </div>
  </div>`;
}
