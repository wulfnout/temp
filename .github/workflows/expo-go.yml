# Publishes the latest Temp app so it opens in Expo Go (branch "preview").
# Runs on GitHub on every push to main that touches the app.
# Needs the EXPO_TOKEN secret: an Expo access token from expo.dev > Account settings > Access tokens.
# Every run saves its log and result to the "expo-go-log" branch so it can be read without screenshots.
name: Send to Expo Go

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/expo-go.yml']
  workflow_dispatch:

concurrency:
  group: expo-go
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for the Expo token
        id: token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN not set yet; skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps; } 2>&1 | tee ../expo.log
          npx expo install --fix 2>&1 | tee -a ../expo.log || true

      - name: Publish update
        if: steps.token.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx --yes eas-cli@latest update --branch preview --environment preview --message "Latest Temp test version" --non-interactive 2>&1 | tee -a ../expo.log

      - name: Save the log (success or failure)
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/log && cp expo.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/expo.log
          echo "${{ job.status }} ${GITHUB_SHA::7} $(date -u +%FT%TZ)" > /tmp/log/status.txt
          cd /tmp/log && git init -q -b expo-go-log && git config user.name "Temp bot" && git config user.email "omegacleantn@gmail.com"
          git add -A && git commit -q -m "Expo Go log ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" expo-go-log
