    try{const st=await loadAll();raw({type:'hydrate',st})}catch(e){console.error(e)}},350)},[]);
  const dispatch=useCallback(a=>{const before=sRef.current;raw(a);if(!myId)return;
    remote(a,before).then(r=>{if(a.type==='story')raw({type:'storyDone'});if(r&&r.toast)raw({type:'toast',msg:r.toast});if(r==='reload'||(r&&r.reload))reload()}).catch(e=>{if(a.type==='story')raw({type:'storyDone'});raw({type:'toast',msg:e.message||'Something went wrong. Try again.'});reload()})},[]);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')setRecovery(true);setSession(ses||null)});
    return()=>sub.subscription.unsubscribe();
  },[]);
  const uidKey=session&&session.user.id;
  useEffect(()=>{
    if(!uidKey){myId=null;setReady(false);raw({type:'hydrate',st:emptyState()});return}
    myId=uidKey;let alive=true;
    loadAll().then(st=>{if(!alive)return;raw({type:'hydrate',st});setReady(true);
      if(!store.get('temp-tour-'+myId)){store.set('temp-tour-'+myId,'1');setTimeout(()=>startTourRef.current&&startTourRef.current(),600)}})
      .catch(e=>{console.error(e);raw({type:'toast',msg:'Couldn’t load Temp. Check your connection and refresh.'});setReady(true)});
    const db=sb.channel('db-'+myId).on('postgres_changes',{event:'*',schema:'public'},()=>reload()).subscribe();
    const live=sb.channel('live',{config:{presence:{key:myId}}});
    live.on('broadcast',{event:'typing'},({payload})=>{if(!payload||payload.to!==myId)return;const from=payload.from;
        raw({type:'typing',id:from,on:true});clearTimeout(typingT[from]);typingT[from]=setTimeout(()=>raw({type:'typing',id:from,on:false}),3500)})
      .on('presence',{event:'sync'},()=>raw({type:'online',ids:Object.keys(live.presenceState())}))
      .subscribe(async st=>{if(st==='SUBSCRIBED'&&sRef.current.settings.activity!==false){try{await live.track({at:Date.now()})}catch(e){}}});
    liveCh=live;
    const poll=setInterval(reload,60000);
    return()=>{alive=false;clearInterval(poll);sb.removeChannel(db);sb.removeChannel(live);liveCh=null};
  },[uidKey]);

  useEffect(()=>{let last=performance.now();const i=setInterval(()=>{const t=performance.now();raw({type:'tick',dt:t-last,paused:tourRef.current!==null});last=t},250);return()=>clearInterval(i)},[]);
  useEffect(()=>{if(tour===null&&view.tab!=='replay')scrollTo(0,0)},[view.tab,view.profileId,view.threadId,setSub]);
  useEffect(()=>{const r=document.documentElement;if(s.settings.theme==='system')delete r.dataset.theme;else r.dataset.theme=s.settings.theme},[s.settings.theme]);
  useEffect(()=>{const t=SHOP.themes.find(x=>x.id===s.theme);const r=document.documentElement.style;
    if(!t||t.id==='ember'){r.removeProperty('--orange');r.removeProperty('--orange-2')}else{r.setProperty('--orange',t.c[0]);r.setProperty('--orange-2',t.c[1])}},[s.theme]);
  useEffect(()=>{if(!s.settings.breakMins)return;const t=setTimeout(()=>setBreakOpen(true),s.settings.breakMins*60e3);return()=>clearTimeout(t)},[s.settings.breakMins,breakOpen]);

  const onTyping=useCallback(id=>{const now=Date.now();if(now-lastTyping.current<1500||!liveCh||id==='temp')return;lastTyping.current=now;
    liveCh.send({type:'broadcast',event:'typing',payload:{from:myId,to:R(id)}}).catch(()=>{})},[]);
  function simulateReply(){}
  function startTour(){
    raw({type:'tourPosts',on:true});setTourIds({a:-901,b:-902});
    setView({tab:'home'});setSheet(null);setStoryUser(null);setSetSub(null);scrollTo(0,0);setTimeout(()=>setTour(0),60);
  }
  startTourRef.current=startTour;
  function endTour(){setTour(null);setTourIds({});raw({type:'tourPosts',on:false});scrollTo({top:0,behavior:'smooth'})}
  async function logout(kind){
    try{if(kind==='delete'){const {error}=await sb.rpc('delete_me');if(error)throw error}}catch(e){raw({type:'toast',msg:friendly(e)});return}
    await sb.auth.signOut();setView({tab:'home'});setSetSub(null);setTour(null);
  }

  const lastTab=useRef({tab:'home'});
  useEffect(()=>{if(view.tab!=='replay')lastTab.current=view},[view]);
  const open={
    leaveReplay:()=>setView(lastTab.current&&lastTab.current.tab!=='replay'?lastTab.current:{tab:'home'}),
    profile:(id,tab)=>setView({tab:id==='me'?'me':'profile',profileId:id,ptab:tab}),
    thread:id=>setView({tab:'thread',threadId:id}),
    comments:id=>setSheet({kind:'comments',id}),
    share:id=>setSheet({kind:'share',id}),
    menu:id=>setSheet({kind:'menu',id}),
    story:u=>setStoryUser(u),
    edit:()=>setSheet({kind:'edit'}),
    settings:()=>{setSetSub(null);setView({tab:'settings'})},
    search:q=>{setQuery(q);setView({tab:'search'})},
    replay:id=>setView({tab:'replay',reelId:id}),
    compose:reel=>setSheet({kind:'compose',reel}),
    record:m=>setSheet({kind:'record',mode:m||'replay'}),
    shop:()=>setView({tab:'shop'}),
    plus:()=>setView({tab:'plus'}),
  };
  const guard=fn=>(...a)=>{if(tour!==null)return;fn(...a)};
  const openSafe=Object.fromEntries(Object.entries(open).map(([k,f])=>[k,guard(f)]));
  const addStory=guard(()=>setSheet({kind:'record',mode:'story'}));
  const sheetPost=sheet&&sheet.id?s.posts.find(p=>p.id===sheet.id):null;
  const close=()=>setSheet(null);
  const unread=Object.keys(s.unread).filter(id=>!s.blocked[id]).length;
  const unreadN=s.notifs.filter(n=>!n.read&&!s.blocked[n.userId]).length;

  if(session===undefined)return html`<${Splash}/>`;
  if(recovery)return html`<${NewPassword} onDone=${()=>setRecovery(false)}/>`;
  if(!session)return html`<${Auth}/>`;
  if(!ready)return html`<${Splash}/>`;

  const backBtn=fn=>html`<button className="circle" onClick=${fn} aria-label="Back"><${Icon} n="back"/></button>`;
  let body,top=null;
  if(view.tab==='home'){
    body=html`<${Home} s=${s} dispatch=${dispatch} open=${openSafe} tourIds=${tourIds} addStory=${addStory}/>`;
    top=html`<div className="top"><div className="top-row">
        <h1 className="logo">temp<i></i></h1>
        <div className="top-actions">
          <button className="circle" aria-label="Activity" data-tour="notifs" onClick=${guard(()=>setView({tab:'activity'}))}><${Icon} n="heart"/>${unreadN>0&&html`<span className="badge">${unreadN}</span>`}</button>
          <button className="circle" aria-label="Messages" onClick=${guard(()=>setView({tab:'dms'}))}><${Icon} n="dm"/>${unread>0&&html`<span className="badge">${unread}</span>`}</button>
        </div></div></div>`;
  } else if(view.tab==='search'){
    body=html`<${Search} s=${s} dispatch=${dispatch} open=${open} query=${query} setQuery=${setQuery}/>`;
    top=html`<div className="top"><div className="top-row"><div className="search"><${Icon} n="search" s=${19}/><label htmlFor="search-in" className="vh">Search</label>
      <input id="search-in" placeholder="Search Temp" value=${query} onChange=${e=>setQuery(e.target.value)}/>${query&&html`<button aria-label="Clear" onClick=${()=>setQuery('')}><${Icon} n="x" s=${18}/></button>`}</div></div></div>`;
  } else if(view.tab==='activity'){
    body=html`<${Activity} s=${s} dispatch=${dispatch} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'home'}))}<span className="top-title">Activity</span></div></div>`;
  } else if(view.tab==='dms'){
    body=html`<${DMList} s=${s} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'home'}))}<span className="top-title">Messages</span></div></div>`;
  } else if(view.tab==='thread'){
    const u=s.users[view.threadId]||{id:view.threadId,name:'Unknown',handle:'unknown',color:'#888'};
    body=html`<${Thread} s=${s} id=${view.threadId} dispatch=${dispatch} simulateReply=${simulateReply} onTyping=${onTyping} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'dms'}))}
      <button style=${{display:'flex',alignItems:'center',gap:10,minWidth:0,textAlign:'left'}} onClick=${()=>open.profile(u.id)}><${Avatar} u=${u} size=${36} online=${s.settings.activity&&u.online}/>
        <span style=${{minWidth:0}}><span className="top-title" style=${{display:'block',fontSize:16}}>${u.name}</span><span className="sub">${s.typing[u.id]?'typing…':s.settings.activity&&u.online?'Active now':'@'+u.handle}</span></span></button></div></div>`;
  } else if(view.tab==='settings'){
    const titles={privacy:'Privacy',notifications:'Notifications',content:'Muted and content',time:'Your time',appearance:'Appearance',about:'About'};
    body=html`<${SettingsView} s=${s} dispatch=${dispatch} sub=${setSub} setSub=${setSetSub} open=${open} replay=${startTour} logout=${logout}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setSub?setSetSub(null):setView({tab:'me'}))}<span className="top-title">${setSub?titles[setSub]:'Settings'}</span></div></div>`;
  } else if(view.tab==='shop'||view.tab==='plus'){
    body=view.tab==='shop'?html`<${ShopView} s=${s} dispatch=${dispatch} open=${open}/>`:html`<${PlusView} s=${s} dispatch=${dispatch}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'me'}))}<span className="top-title">${view.tab==='shop'?'Fire Sale':'Temp+'}</span></div></div>`;
  } else if(view.tab==='replay'){
    body=html`<${Replay} s=${s} dispatch=${dispatch} open=${open} startId=${view.reelId}/>`;
  } else {
    const id=view.tab==='me'?'me':view.profileId;
    body=html`<${Profile} key=${id+(view.ptab||'')} s=${s} id=${id} dispatch=${dispatch} open=${open} startTab=${view.ptab} back=${view.tab==='profile'?()=>setView({tab:'home'}):null}/>`;
  }
  const isReplay=view.tab==='replay';

  return html`<div className="app">
    <${BarsOnScroll} on=${view.tab==='home'}/>
    ${top}
    ${body}

    <nav className=${'nav'+(isReplay?' dark':'')} aria-label="Main"><div className="nav-in">
      <button aria-label="Home" aria-current=${view.tab==='home'?'page':null} onClick=${guard(()=>setView({tab:'home'}))}><${Icon} n="home" s=${25}/></button>
      <button aria-label="Search" data-tour="nav-search" aria-current=${view.tab==='search'?'page':null} onClick=${guard(()=>setView({tab:'search'}))}><${Icon} n="search" s=${25}/></button>
      <button className="create" aria-label="New post" data-tour="nav-create" onClick=${guard(()=>setSheet({kind:'compose',reel:isReplay}))}><${Icon} n="plus" s=${26} w=${2.6}/></button>
      <button aria-label="Replay" data-tour="nav-replay" aria-current=${isReplay?'page':null} onClick=${guard(()=>setView({tab:'replay'}))}><${Icon} n="reels" s=${25}/></button>
      <button aria-label="Profile" data-tour="nav-me" aria-current=${['me','settings','shop','plus'].includes(view.tab)?'page':null} onClick=${guard(()=>setView({tab:'me'}))}><${Avatar} u=${s.users.me} size=${28}/></button>
    </div></nav>

    <input ref=${storyFile} type="file" accept="image/*,video/*" className="vh" id="story-file"
      onChange=${e=>{const f=e.target.files[0];if(f){const r=readFile(f);setStoryDraft({url:r.url,type:r.type,file:f})}e.target.value=''}}/>
    ${storyDraft&&html`<${StoryDraft} draft=${storyDraft} onClose=${()=>setStoryDraft(null)} onPost=${cap=>{dispatch({type:'story',url:storyDraft.url,mtype:storyDraft.type,file:storyDraft.file,caption:cap});setStoryDraft(null)}}/>`}
    ${sheet&&sheet.kind==='compose'&&html`<${Composer} s=${s} dispatch=${dispatch} onClose=${close} startReel=${sheet.reel} open=${open}/>`}
    ${sheet&&sheet.kind==='record'&&html`<${Recorder} s=${s} dispatch=${dispatch} onClose=${close} open=${open} startMode=${sheet.mode} onStory=${d=>{close();setStoryDraft(d)}}/>`}
    ${sheet&&sheet.kind==='comments'&&sheetPost&&html`<${Comments} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close} open=${open}/>`}
    ${sheet&&sheet.kind==='share'&&sheetPost&&html`<${Share} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close}/>`}
    ${sheet&&sheet.kind==='menu'&&sheetPost&&html`<${PostMenu} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close} open=${open}/>`}
    ${sheet&&sheet.kind==='edit'&&html`<${EditProfile} s=${s} dispatch=${dispatch} onClose=${close}/>`}
    ${storyUser&&html`<${StoryViewer} s=${s} startUser=${storyUser} dispatch=${dispatch} onClose=${()=>setStoryUser(null)} onAdd=${()=>{setStoryUser(null);setSheet({kind:'record',mode:'story'})}}/>`}
    ${breakOpen&&html`<div className="modal" role="dialog" aria-label="Take a break"><div className="modal-card">
      <span className="orb" style=${{width:64,height:64}}><span className="av" style=${{width:'100%',height:'100%',background:'var(--card)',borderRadius:'inherit',border:0}}><${Icon} n="clock" s=${26}/></span></span>
      <h3>Time for a break?</h3><p className="sub" style=${{margin:0}}>You’ve been scrolling for ${s.settings.breakMins} minutes.</p>
      <button className="btn orange wide" onClick=${()=>setBreakOpen(false)}>Got it</button>
      <button className="t-skip" onClick=${()=>{dispatch({type:'set',key:'breakMins',value:0});setBreakOpen(false)}}>Turn off reminders</button></div></div>`}
    ${tour!==null&&html`<${Tour} s=${s} ids=${tourIds} step=${tour} setStep=${setTour} onEnd=${endTour}/>`}
    ${s.toast&&tour===null&&html`<div className=${'toast'+(s.toast.sticky?' sticky':'')} key=${s.toast.at} role="status">${s.toast.sticky?html`<span className="t-spin" aria-hidden="true"></span>`:null}${s.toast.msg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
