function PwField({id,label,value,onChange,auto}){
  const [show,setShow]=useState(false);
  return html`<div className="field"><label htmlFor=${id}>${label}</label>
    <div className="pw"><input id=${id} type=${show?'text':'password'} autoComplete=${auto} value=${value} onChange=${e=>onChange(e.target.value)}/>
    <button type="button" onClick=${()=>setShow(!show)} aria-label=${show?'Hide password':'Show password'}>${show?'Hide':'Show'}</button></div></div>`;
}
function Splash(){return html`<div className="welcome"><div className="welcome-in" style=${{justifyContent:'center'}}><div className="w-hero" style=${{paddingTop:0}}><h1 className="w-mark">temp<i></i></h1><div className="w-orbs"><span></span><span></span><span></span></div></div></div></div>`}
function Auth(){
  const [mode,setMode]=useState('signup');
  const [f,setF]=useState({name:'',handle:'',email:'',pw:'',birth:''});
  const [err,setErr]=useState('');const [note,setNote]=useState('');const [busy,setBusy]=useState(false);
  const up=(k,v)=>{setF({...f,[k]:v});setErr('')};
  const go=m=>{setMode(m);setErr('');setNote('')};
  const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  async function submit(e){
    e.preventDefault();if(busy)return;setErr('');setNote('');
    const email=f.email.trim().toLowerCase();
    try{
      setBusy(true);
      if(mode==='signup'){
        const handle=f.handle.trim().toLowerCase().replace(/^@/,'');
        if(!f.name.trim())return setErr('Enter your name.');
        if(!/^[a-z0-9._]{3,20}$/.test(handle))return setErr('Usernames are 3–20 letters, numbers, dots or underscores.');
        if(!emailOk(email))return setErr('Enter a valid email.');
        if(!f.birth)return setErr('Enter your birthday.');
        const age=(Date.now()-new Date(f.birth))/31557600000;if(!(age>=13))return setErr('You need to be 13 or older to use Temp.');
        if(f.pw.length<8)return setErr('Passwords need at least 8 characters.');
        const {data:free,error:e1}=await sb.rpc('handle_available',{h:handle});if(e1)throw e1;
        if(!free)return setErr(`@${handle} is taken. Try another.`);
        const {data,error}=await sb.auth.signUp({email,password:f.pw,options:{data:{name:f.name.trim(),handle,birth:f.birth},emailRedirectTo:location.origin+location.pathname}});
        if(error){if(/registered|exists/i.test(error.message))return setErr('That email already has an account. Sign in instead.');if(/database error/i.test(error.message))return setErr('Couldn’t create that account. Try a different username.');throw error}
        if(!data.session){setMode('signin');setNote(`Check ${email} for a link to confirm your account, then sign in.`)}
      } else if(mode==='signin'){
        if(!emailOk(email)||!f.pw)return setErr('Enter your email and password.');
        const {error}=await sb.auth.signInWithPassword({email,password:f.pw});
        if(error)return setErr(/confirm/i.test(error.message)?'Confirm your email first. Check your inbox for the link.':'That email and password don’t match.');
      } else {
        if(!emailOk(email))return setErr('Enter a valid email.');
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        setNote(`If ${email} has an account, a reset link is on its way.`);
      }
    }catch(x){setErr(friendly(x))}finally{setBusy(false)}
  }
  return html`<div className="welcome"><div className="welcome-in">
    <div className="w-hero"><h1 className="w-mark">temp<i></i></h1><div className="w-orbs"><span></span><span></span><span></span></div></div>
    <form className="w-form" onSubmit=${submit} noValidate>
      ${mode!=='forgot'?html`<div className="seg" role="group" aria-label="Account" style=${{marginBottom:6}}>
          <button type="button" aria-pressed=${mode==='signup'} onClick=${()=>go('signup')}>Sign up</button>
          <button type="button" aria-pressed=${mode==='signin'} onClick=${()=>go('signin')}>Sign in</button></div>`
        :html`<h2 className="top-title" style=${{fontSize:22,margin:'0 0 4px'}}>Reset password</h2>`}
      ${mode==='signup'&&html`
        <div className="field"><label htmlFor="a-name">Name</label><input id="a-name" autoComplete="name" value=${f.name} onChange=${e=>up('name',e.target.value)} maxLength=${40}/></div>
        <div className="field"><label htmlFor="a-handle">Username</label><input id="a-handle" autoComplete="username" autoCapitalize="none" value=${f.handle} onChange=${e=>up('handle',e.target.value.replace(/\s/g,''))} maxLength=${21}/></div>`}
      <div className="field"><label htmlFor="a-email">Email</label><input id="a-email" type="email" autoComplete="email" autoCapitalize="none" value=${f.email} onChange=${e=>up('email',e.target.value)}/></div>
      ${mode==='signup'&&html`<div className="field"><label htmlFor="a-birth">Birthday</label><input id="a-birth" type="date" autoComplete="bday" value=${f.birth} onChange=${e=>up('birth',e.target.value)}/></div>`}
      ${mode!=='forgot'&&html`<${PwField} id="a-pw" label="Password" auto=${mode==='signup'?'new-password':'current-password'} value=${f.pw} onChange=${v=>up('pw',v)}/>`}
      ${mode==='signin'&&html`<button type="button" className="a-link" onClick=${()=>go('forgot')}>Forgot password?</button>`}
      ${err&&html`<p className="a-err" role="alert">${err}</p>`}
      ${note&&html`<p className="a-note" role="status">${note}</p>`}
      <button type="submit" className="btn orange wide" disabled=${busy} style=${{marginTop:18}}>${busy?'One sec…':mode==='signup'?'Create account':mode==='signin'?'Sign in':'Send reset link'}</button>
      ${mode==='forgot'&&html`<button type="button" className="a-link" style=${{justifySelf:'center',marginTop:10}} onClick=${()=>go('signin')}>Back to sign in</button>`}
    </form>
  </div></div>`;
}
function NewPassword({onDone}){
  const [pw,setPw]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  async function submit(e){e.preventDefault();if(pw.length<8)return setErr('Passwords need at least 8 characters.');setBusy(true);
    const {error}=await sb.auth.updateUser({password:pw});setBusy(false);if(error)return setErr(friendly(error));onDone()}
  return html`<div className="welcome"><div className="welcome-in">
    <div className="w-hero"><h1 className="w-mark">temp<i></i></h1></div>
    <form className="w-form" onSubmit=${submit} noValidate><h2 className="top-title" style=${{fontSize:22,margin:'0 0 4px'}}>New password</h2>
      <${PwField} id="np-pw" label="New password" auto="new-password" value=${pw} onChange=${v=>{setPw(v);setErr('')}}/>
      ${err&&html`<p className="a-err" role="alert">${err}</p>`}
      <button type="submit" className="btn orange wide" disabled=${busy} style=${{marginTop:18}}>Save password</button></form>
  </div></div>`;
}

    {target:'freeze-b',title:'Freeze a take that flops',body:'When freezes outnumber heat, the post is frozen: greyed out, comments off.',try:'Tap the snowflake',done:()=>B&&B.myFreeze},

    {target:'notifs',title:'Activity',body:'New followers, mentions, and likes on your comments show up here.'},
    {target:'nav-search',title:'Search',body:'Find people, posts and trending hashtags.'},

    dims=html`
      <div className="tour-dim" style=${{inset:0,clipPath:clip,WebkitClipPath:clip}}></div>
      <div className="tour-ring" style=${{left:x,top:y,width:w,height:h,borderRadius:R}}></div>`;
    const cw=Math.min(340,vp.w-32);
    const below=y+h+14+ch<vp.h-16, above=y-14-ch>16;
    card={left:Math.min(Math.max(16,x+w/2-cw/2),vp.w-cw-16),top:below?y+h+14:above?y-14-ch:Math.max(16,vp.h-ch-16)};

    ${rect?dims:html`<div className="tour-dim" style=${{inset:0}}></div>`}
    <div ref=${cardRef} className=${'tour-card'+(rect?'':' center')} style=${card} key=${step}>
      <div className="t-step">${step+1}/${steps.length}</div>
      <h2 className="t-title">${st.title}</h2>
      <p className="t-body">${st.body}</p>
      ${st.try&&html`<div className=${'t-try'+(done?' done':'')}>${done?'Nice.':st.try}</div>`}
      <div className="t-dots">${steps.map((_,i)=>html`<span key=${i} className=${i<=step?'on':''}></span>`)}</div>
      <div className="t-foot">

          ${step>0&&!st.last&&html`<button className="btn ghost" onClick=${()=>setStep(step-1)}>Back</button>`}

        </div>
      </div>
    </div>
  </div>`;
}

// Join a realtime room and keep it joined: retries on errors/timeouts, and switches between a private
// (signed-in) and a public channel in case one of them is refused. Sets eng.ch to the live channel.
function rtJoin(eng,topic,bind){
  let priv=true,tries=0;
  return new Promise(res=>{
    const open=()=>{
      if(eng.left)return;
      const ch=sb.channel(topic,{config:{private:priv,broadcast:{self:false},presence:{key:eng.me}}});bind(ch);eng.ch=ch;
      ch.subscribe(async(st,err)=>{
        if(eng.left||eng.ch!==ch)return;
        if(st==='SUBSCRIBED'){tries=0;try{await ch.track({at:Date.now()})}catch(e){}eng.status&&eng.status('ok');res()}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){

    };
    open();
  });
}

const SparkIco=({s=14})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" aria-hidden="true" className="spark-ico"><path d="M12 1.5c.7 6.3 2.4 8.7 10.5 10.5-8.1 1.8-9.8 4.2-10.5 10.5-.7-6.3-2.4-8.7-10.5-10.5C9.6 10.2 11.3 7.8 12 1.5Z" fill="#ffb347"/><path d="M12 7.5c.3 2.6 1 3.6 4.5 4.5-3.5.9-4.2 1.9-4.5 4.5-.3-2.6-1-3.6-4.5-4.5 3.5-.9 4.2-1.9 4.5-4.5Z" fill="#fff6d6"/></svg>`;
const GIFTS_LOCAL=[['spark','Spark',1,'small'],['ember','Ember',5,'small'],['icecube','Ice Cube',10,'small'],['hotsauce','Hot Sauce',19,'small'],['rose','Ember Rose',29,'small'],['thermo','Heat Check',49,'small'],
  ['heart','Molten Heart',99,'medium'],['mic','Mic Drop',149,'medium'],['crown','Fire Crown',299,'medium'],['volcano','Volcano',499,'big'],['meteor','Meteor',999,'big'],['phoenix','Phoenix',2999,'big']].map(([id,name,cost,tier])=>({id,name,cost,tier}));
const giftById=id=>GIFTS_LOCAL.find(g=>g.id===id)||GIFTS_LOCAL[0];
const SPARK_PACKS=[[70,'$0.99'],[350,'$4.99'],[700,'$9.99'],[1400,'$19.99'],[3500,'$49.99'],[7000,'$99.99']];
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':String(n);

// big gift animations that take over the screen
function GiftShow({g,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,g.tier==='big'?(g.id==='phoenix'?4300:3400):2100);return()=>clearTimeout(t)},[]);
  const r=rnd(g.k*1000|0);const n=(k,f)=>Array.from({length:k},(_,i)=>f(i));
  return html`<div className=${'gx gx-'+(g.tier==='big'?g.id:'pop')} aria-hidden="true">
    ${g.id==='volcano'&&html`<i className="gx-tint"></i>${n(26,i=>html`<i key=${i} className="gx-lava" style=${{'--dx':(r()*80-40)+'vw','--h':(30+r()*45)+'vh','--d':(0.5+r()*1.2)+'s','--s':(6+r()*12)+'px'}}></i>`)}`}
    ${g.id==='meteor'&&html`<i className="gx-flash"></i><i className="gx-wave"></i>${n(18,i=>html`<i key=${i} className="gx-deb" style=${{'--a':(i*20)+'deg','--r':(18+r()*22)+'vmin','--s':(4+r()*8)+'px'}}></i>`)}`}
    ${g.id==='phoenix'&&html`<i className="gx-glow"></i>${n(30,i=>html`<i key=${i} className="gx-emb" style=${{left:(30+r()*40)+'%','--d':(r()*2.6)+'s','--dx':(r()*30-15)+'vw','--s':(3+r()*6)+'px'}}></i>`)}`}
    ${g.tier!=='big'&&html`<i className="gx-ring"></i>`}
    <div className="gx-art"><${GiftArt} id=${g.id} size=${256}/></div>
    <div className="gx-cap"><b>${g.name}</b> sent ${g.gname}${g.qty>1?' ×'+g.qty:''}</div>
  </div>`;
}

// gift panel + Sparks wallet
function GiftPanel({wallet,setWallet,targets,onSend,onClose}){
  const [sel,setSel]=useState(null);const [view,setView]=useState('gifts');const [to,setTo]=useState(targets[0]&&targets[0].id);const [msg,setMsg]=useState('');
  const claim=async()=>{const {data,error}=await sb.rpc('claim_daily_sparks');if(error){setMsg(friendly(error));return}setWallet(w=>({...w,sparks:data,can_claim:false}));setMsg('+100 Sparks added')};
  const g=sel&&giftById(sel);
  return html`<div className="gp" onClick=${e=>e.stopPropagation()}>
    <div className="gp-head">
      <div className="gp-tabs"><button aria-pressed=${view==='gifts'} onClick=${()=>setView('gifts')}>Gifts</button><button aria-pressed=${view==='wallet'} onClick=${()=>setView('wallet')}>Sparks</button></div>
      <button className="gp-bal" onClick=${()=>setView('wallet')}><${SparkIco} s=${15}/>${wallet?wallet.sparks.toLocaleString():'…'}<span>Get</span></button>
      <button className="gp-x" onClick=${onClose} aria-label="Close gifts"><${Icon} n="x" s=${18}/></button>
    </div>
    ${view==='gifts'?html`
      ${targets.length>1&&html`<div className="gp-to"><span>Send to</span>${targets.map(t=>html`<button key=${t.id} aria-pressed=${to===t.id} onClick=${()=>setTo(t.id)}><${Avatar} u=${t.u} size=${22} noRing=${true}/>${t.u.name}</button>`)}</div>`}
      <div className="gp-grid">${GIFTS_LOCAL.map(x=>html`<button key=${x.id} className=${'gp-item'+(sel===x.id?' on':'')+(x.tier==='big'?' big':'')} onClick=${()=>setSel(sel===x.id?null:x.id)}>
        <${GiftArt} id=${x.id} size=${46}/><b>${x.name}</b><span><${SparkIco} s=${10}/>${x.cost.toLocaleString()}</span>
        ${sel===x.id&&html`<i className="gp-send" onClick=${e=>{e.stopPropagation();onSend(x,to)}}>Send</i>`}</button>`)}</div>
      ${msg&&html`<p className="gp-msg">${msg}</p>`}`
    :html`<div className="gp-wallet">
      <div className="gp-big"><${SparkIco} s=${34}/><b>${wallet?wallet.sparks.toLocaleString():'…'}</b><span>Sparks</span></div>
      <button className="btn orange wide" disabled=${!wallet||!wallet.can_claim} onClick=${claim}>${wallet&&!wallet.can_claim?'Daily Sparks claimed · back tomorrow':'Claim 100 free Sparks today'}</button>
      <div className="gp-packs">${SPARK_PACKS.map(([n,p])=>html`<div key=${n} className="gp-pack"><${SparkIco} s=${20}/><b>${n.toLocaleString()}</b><span>${p}</span><em>Soon</em></div>`)}</div>
      <div className="gp-stats"><div><b>${wallet?fmtK(wallet.sent):'–'}</b><span>Sent</span></div><div><b>${wallet?fmtK(wallet.received):'–'}</b><span>Received</span></div></div>
      ${msg&&html`<p className="gp-msg">${msg}</p>`}
    </div>`}
  </div>`;
}

function StreamRoom({id,me,people,setPeople,onExit,fx0,onFx}){

  const pend=useRef({likes:0,t:null});const comboRef=useRef(null);const seenIds=useRef(null);
  const [dbViewers,setDbViewers]=useState([]);const [streak,setStreak]=useState(0);const [sent,setSent]=useState(null);const streakT=useRef(null);const streakN=useRef(0);const [conn,setConn]=useState('ok');const lastGiftId=useRef(0);const heard=useRef({});const giftRows=useRef([]);
  const isHost=row&&row.host_id===me;const isGuest=row&&row.guest_id===me;const onCam=isHost||isGuest;
  const loadRow=async(n=0)=>{const {data,error}=await sb.from('live_streams').select('*').eq('id',id).maybeSingle();
    if(!data){if(n<8)setTimeout(()=>loadRow(n+1),1500);else setErr(error?friendly(error):'Couldn’t load this live.');return}
    if(data){setRow(data);const need=[data.host_id,data.guest_id].filter(x=>x&&!people[x]);
    if(need.length){const {data:p}=await sb.from('profiles').select('id,name,handle,avatar_url,ring').in('id',need);setPeople(x=>{const n={...x};(p||[]).forEach(q=>n[q.id]=liveUser(q));return n})}}};

  const loadGifts=async()=>{const {data}=await sb.from('live_gift_events').select('id,from_id,to_id,gift_id,qty,sparks,created_at').eq('stream_id',id).gt('id',lastGiftId.current).order('id').limit(500);
    if(!data||!data.length)return;const first=lastGiftId.current===0;lastGiftId.current=data[data.length-1].id;giftRows.current=[...giftRows.current,...data];setEvents(giftRows.current);
    if(first)return;data.forEach(r=>{if(r.from_id===me)return;const k=r.from_id+'|'+r.gift_id+'|'+(r.to_id||'');const h=heard.current[k]||0;if(h>0){heard.current[k]=Math.max(0,h-(r.qty||1));return}
      showGift({from:r.from_id,gift:r.gift_id,qty:r.qty,to:r.to_id});setChat(c=>[...c.slice(-40),{from:r.from_id,gift:r.gift_id,qty:r.qty,k:Math.random()}])})};
  const ping=async(leaving)=>{await sb.rpc('live_ping',{sid:id,leaving:!!leaving});if(leaving)return;
    const since=new Date(Date.now()-45e3).toISOString();const {data}=await sb.from('live_viewers').select('user_id').eq('stream_id',id).gte('last_seen',since);if(data)setDbViewers(data.map(x=>x.user_id))};
  const loadWallet=async()=>{const {data}=await sb.rpc('my_sparks');const w=Array.isArray(data)?data[0]:data;if(w)setWallet(w)};
  const loadScore=async()=>{const {data}=await sb.rpc('live_match_score',{sid:id});const x=Array.isArray(data)?data[0]:data;if(x)setScore({h:+x.host_score||0,g:+x.guest_score||0})};
  const who=async uid=>{if(people[uid])return people[uid];const {data}=await sb.from('profiles').select('id,name,handle,avatar_url,ring').eq('id',uid).single();if(data){const u=liveUser(data);setPeople(x=>({...x,[uid]:u}));return u}return liveUser(null)};
  const lvFor=useRef(new Set());

        <button onClick=${()=>eng.current.flip().catch(()=>{})} aria-label="Flip camera"><${Icon} n="replay" s=${20}/></button>`
      :html`${!asked&&html`<button onClick=${()=>{eng.current.send('req',{});setAsked(true)}} aria-label="Ask to join"><${Icon} n="plus" s=${20}/></button>`}
        <button className="gl-giftbtn" onClick=${()=>{setPanel(panel==='gifts'?null:'gifts');loadWallet()}} aria-label="Send a gift"><${GiftArt} id="rose" size=${26}/></button>
        <button onClick=${heart} aria-label="Send a like"><${LikeFlame} s=${24}/></button>`}
    </div>
  </div>`;
}
function GoalForm({row,onSave}){
  const [g,setG]=useState(row&&row.goal||500);const [l,setL]=useState(row&&row.goal_label||'');
  return html`<div className="gp-goal"><div className="gp-chips">${[100,500,1000,2500,5000,10000].map(v=>html`<button key=${v} aria-pressed=${g===v} onClick=${()=>setG(v)}><${SparkIco} s=${11}/>${fmtK(v)}</button>`)}</div>
    <input placeholder="What's it for? (optional)" maxLength=${40} value=${l} onInput=${e=>setL(e.target.value)} aria-label="Goal label"/>
    <div className="gp-row2"><button className="btn ghost" onClick=${()=>onSave(null,'')}>Remove goal</button><button className="btn orange" onClick=${()=>onSave(g,l.trim())}>Set goal</button></div></div>`;
}
function GoLiveEmbed(){
  const [tok,setTok]=useState(EMBED_TOKEN);useEffect(()=>{window.__tempToken=t=>{EMBED_TOKEN=t;try{sb.realtime.setAuth(t)}catch(e){}setTok(t)}},[]);
  const me=jwtSub(tok);if(!me)return html`<div className="empty">Sign in to go live.</div>`;
  const sw=+(new URLSearchParams(location.search).get('stream')||0)||null;
  return html`<div className="gl-embed"><${GoLivePage} me=${me} startWatch=${sw} onClose=${()=>{try{window.ReactNativeWebView.postMessage('close')}catch(e){}}}/></div>`;
}

function App(){
  const [s,raw]=useReducer(reducer,null,emptyState);
  const [view,setView]=useState({tab:'home'});
  const [sheet,setSheet]=useState(null);
  const [storyUser,setStoryUser]=useState(null);
  const [storyDraft,setStoryDraft]=useState(null);
  const [session,setSession]=useState(undefined);
  const [recovery,setRecovery]=useState(false);
  const [ready,setReady]=useState(false);
  const [tour,setTour]=useState(null);
  const [tourIds,setTourIds]=useState({});
  const [query,setQuery]=useState('');
  const [setSub,setSetSub]=useState(null);
  const [breakOpen,setBreakOpen]=useState(false);
  const tourRef=useRef(null);tourRef.current=tour;
  const sRef=useRef(s);sRef.current=s;const viewRef=useRef(view);viewRef.current=view;
  const storyFile=useRef();const reloadT=useRef();const lastTyping=useRef(0);const startTourRef=useRef();

  const reload=useCallback(()=>{clearTimeout(reloadT.current);reloadT.current=setTimeout(async()=>{
    try{const st=await loadAll();raw({type:'hydrate',st})}catch(e){console.error(e)}},350)},[]);
  const dispatch=useCallback(a=>{const before=sRef.current;raw(a);if(!myId)return;
    remote(a,before).then(r=>{if(a.type==='story')raw({type:'storyDone'});if(r&&r.toast)raw({type:'toast',msg:r.toast});if(r==='reload'||(r&&r.reload))reload()}).catch(e=>{if(a.type==='story')raw({type:'storyDone'});raw({type:'toast',msg:e.message||'Something went wrong. Try again.'});reload()})},[]);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')setRecovery(true);setSession(ses||null)});
    return()=>sub.subscription.unsubscribe();
  },[]);
  const uidKey=session&&session.user.id;
  useEffect(()=>{
    if(!uidKey){myId=null;setReady(false);raw({type:'hydrate',st:emptyState()});return}
    myId=uidKey;let alive=true;
    loadAll().then(st=>{if(!alive)return;raw({type:'hydrate',st});setReady(true);
      // the tour is for brand-new accounts only, and once it's been shown it's remembered on the account (not just this browser)
      const fresh=session.user.created_at&&Date.now()-new Date(session.user.created_at).getTime()<36*HOUR;
      if(fresh&&!(st.settings&&st.settings.tourDone)&&!store.get('temp-tour-'+myId)){store.set('temp-tour-'+myId,'1');dispatch({type:'set',key:'tourDone',value:true});setTimeout(()=>startTourRef.current&&startTourRef.current(),600)}
      else store.set('temp-tour-'+myId,'1')})
      .catch(e=>{console.error(e);raw({type:'toast',msg:'Couldn’t load Temp. Check your connection and refresh.'});setReady(true)});
    const db=sb.channel('db-'+myId).on('postgres_changes',{event:'*',schema:'public'},()=>reload()).subscribe();
    const live=sb.channel('live',{config:{presence:{key:myId}}});
    live.on('broadcast',{event:'typing'},({payload})=>{if(!payload||payload.to!==myId)return;const from=payload.from;
        raw({type:'typing',id:from,on:true});clearTimeout(typingT[from]);typingT[from]=setTimeout(()=>raw({type:'typing',id:from,on:false}),3500)})
      .on('presence',{event:'sync'},()=>raw({type:'online',ids:Object.keys(live.presenceState())}))
      .subscribe(async st=>{if(st==='SUBSCRIBED'&&sRef.current.settings.activity!==false){try{await live.track({at:Date.now()})}catch(e){}}});
    liveCh=live;
    const poll=setInterval(reload,60000);
    return()=>{alive=false;clearInterval(poll);sb.removeChannel(db);sb.removeChannel(live);liveCh=null};
  },[uidKey]);

  useEffect(()=>{let last=performance.now();const i=setInterval(()=>{const t=performance.now();raw({type:'tick',dt:t-last,paused:tourRef.current!==null});last=t},250);return()=>clearInterval(i)},[]);
  useEffect(()=>{if(tour===null&&view.tab!=='replay')scrollTo(0,0)},[view.tab,view.profileId,view.threadId,setSub]);
  useEffect(()=>{const r=document.documentElement;if(s.settings.theme==='system')delete r.dataset.theme;else r.dataset.theme=s.settings.theme},[s.settings.theme]);
  useEffect(()=>{const t=SHOP.themes.find(x=>x.id===s.theme);const r=document.documentElement.style;
    document.documentElement.classList.toggle('glowing',!!(t&&t.glow));document.documentElement.classList.toggle('blackout',!!(t&&t.mono));
    if(!t||t.id==='ember'||t.mono){r.removeProperty('--orange');r.removeProperty('--orange-2')}else{r.setProperty('--orange',t.c[0]);r.setProperty('--orange-2',t.c[1])}},[s.theme]);
  useEffect(()=>{if(!s.settings.breakMins)return;const t=setTimeout(()=>setBreakOpen(true),s.settings.breakMins*60e3);return()=>clearTimeout(t)},[s.settings.breakMins,breakOpen]);

  const onTyping=useCallback(id=>{const now=Date.now();if(now-lastTyping.current<1500||!liveCh||id==='temp')return;lastTyping.current=now;
    liveCh.send({type:'broadcast',event:'typing',payload:{from:myId,to:R(id)}}).catch(()=>{})},[]);
  function simulateReply(){}
  function startTour(){
    raw({type:'tourPosts',on:true});setTourIds({a:-901,b:-902});
    setView({tab:'home'});setSheet(null);setStoryUser(null);setSetSub(null);scrollTo(0,0);setTimeout(()=>setTour(0),60);
  }
  startTourRef.current=startTour;
  function endTour(){setTour(null);setTourIds({});raw({type:'tourPosts',on:false});scrollTo({top:0,behavior:'smooth'})}
  async function logout(kind){
    try{if(kind==='delete'){const {error}=await sb.rpc('delete_me');if(error)throw error}}catch(e){raw({type:'toast',msg:friendly(e)});return}
    await sb.auth.signOut();setView({tab:'home'});setSetSub(null);setTour(null);
  }

  const lastTab=useRef({tab:'home'});
  useEffect(()=>{if(view.tab!=='replay')lastTab.current=view},[view]);
  const open={
    live:()=>setView({tab:'live'}),
    leaveReplay:()=>setView(lastTab.current&&lastTab.current.tab!=='replay'?lastTab.current:{tab:'home'}),
    profile:(id,tab)=>setView({tab:id==='me'?'me':'profile',profileId:id,ptab:tab}),
    thread:id=>setView({tab:'thread',threadId:id}),
    comments:id=>setSheet({kind:'comments',id}),
    share:id=>setSheet({kind:'share',id}),
    menu:id=>setSheet({kind:'menu',id}),
    story:u=>setStoryUser(u),
    edit:()=>setSheet({kind:'edit'}),
    settings:()=>{setSetSub(null);setView({tab:'settings'})},
    search:q=>{setQuery(q);setView({tab:'search'})},
    replay:id=>setView({tab:'replay',reelId:id}),
    post:id=>setView({tab:'post',postId:id}),
    compose:reel=>setSheet({kind:'compose',reel}),
    record:m=>setSheet({kind:'record',mode:m||'replay'}),
    shop:()=>setView({tab:'shop'}),
    plus:()=>setView({tab:'plus'}),
  };
  const guard=fn=>(...a)=>{if(tour!==null)return;fn(...a)};
  const openSafe=Object.fromEntries(Object.entries(open).map(([k,f])=>[k,guard(f)]));
  const addStory=guard(()=>setSheet({kind:'record',mode:'story'}));
  const sheetPost=sheet&&sheet.id?s.posts.find(p=>p.id===sheet.id):null;
  const close=()=>setSheet(null);
  const unread=Object.keys(s.unread).filter(id=>!s.blocked[id]).length;
  const unreadN=s.notifs.filter(n=>!n.read&&!s.blocked[n.userId]).length;

  // hidden Go Live page: swipe in from the left edge on home (or tap the tab that peeks out now and then)
  const [side,setSide]=useState(false);const [peek,setPeek]=useState(false);const [sideWatch,setSideWatch]=useState(null);
  useEffect(()=>{window.__openLive=id=>{setSideWatch(id);setSide(true)};return()=>{window.__openLive=null}},[]);
  useEffect(()=>{window.__openGoLive=view.tab==='home'?()=>setSide(true):null;return()=>{window.__openGoLive=null}},[view.tab]);
  useEffect(()=>{if(view.tab!=='home'||side)return;let t,h;const plan=()=>{t=setTimeout(()=>{if(Math.random()<.4){setPeek(true);h=setTimeout(()=>setPeek(false),2600)}plan()},(90+Math.random()*330)*1000)};plan();
    return()=>{clearTimeout(t);clearTimeout(h);setPeek(false)}},[view.tab,side]);
  if(session===undefined)return html`<${Splash}/>`;
  if(recovery)return html`<${NewPassword} onDone=${()=>setRecovery(false)}/>`;
  if(!session)return html`<${Auth}/>`;
  if(!ready)return html`<${Splash}/>`;

  const backBtn=fn=>html`<button className="circle" onClick=${fn} aria-label="Back"><${Icon} n="back"/></button>`;
  let body,top=null;
  if(view.tab==='home'){
    body=html`<${Home} s=${s} dispatch=${dispatch} open=${openSafe} tourIds=${tourIds} addStory=${addStory}/>`;
    top=html`<div className="top"><div className="top-row">
        <h1 className="logo"><button className="logo-btn" aria-label="Temp home — back to the top" onClick=${()=>{setView({tab:'home'});scrollTo({top:0,behavior:'smooth'})}}>temp<i></i></button></h1>
        <div className="top-actions">
          <button className="circle" aria-label="Activity" data-tour="notifs" onClick=${guard(()=>setView({tab:'activity'}))}><${Icon} n="heart"/>${unreadN>0&&html`<span className="badge">${unreadN}</span>`}</button>
          <button className="circle" aria-label="Messages" onClick=${guard(()=>setView({tab:'dms'}))}><${Icon} n="dm"/>${unread>0&&html`<span className="badge">${unread}</span>`}</button>
        </div></div></div>`;
  } else if(view.tab==='search'){
    body=html`<${Search} s=${s} dispatch=${dispatch} open=${open} query=${query} setQuery=${setQuery}/>`;
    top=html`<div className="top"><div className="top-row"><div className="search"><${Icon} n="search" s=${19}/><label htmlFor="search-in" className="vh">Search</label>
      <input id="search-in" placeholder="Search Temp" value=${query} onChange=${e=>setQuery(e.target.value)}/>${query&&html`<button aria-label="Clear" onClick=${()=>setQuery('')}><${Icon} n="x" s=${18}/></button>`}</div></div></div>`;
  } else if(view.tab==='activity'){
    body=html`<${Activity} s=${s} dispatch=${dispatch} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'home'}))}<span className="top-title">Activity</span></div></div>`;
  } else if(view.tab==='dms'){
    body=html`<${DMList} s=${s} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'home'}))}<span className="top-title">Messages</span></div></div>`;
  } else if(view.tab==='thread'){
    const u=s.users[view.threadId]||{id:view.threadId,name:'Unknown',handle:'unknown',color:'#888'};
    body=html`<${Thread} s=${s} id=${view.threadId} dispatch=${dispatch} simulateReply=${simulateReply} onTyping=${onTyping} open=${open}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'dms'}))}
      <button style=${{display:'flex',alignItems:'center',gap:10,minWidth:0,textAlign:'left'}} onClick=${()=>open.profile(u.id)}><${Avatar} u=${u} size=${36} online=${s.settings.activity&&u.online}/>
        <span style=${{minWidth:0}}><span className="top-title" style=${{display:'block',fontSize:16}}>${u.name}</span><span className="sub">${s.typing[u.id]?'typing…':s.settings.activity&&u.online?'Active now':'@'+u.handle}</span></span></button></div></div>`;
  } else if(view.tab==='settings'){
    const titles={privacy:'Privacy',notifications:'Notifications',content:'Muted and content',time:'Your time',appearance:'Appearance',about:'About'};
    body=html`<${SettingsView} s=${s} dispatch=${dispatch} sub=${setSub} setSub=${setSetSub} open=${open} replay=${startTour} logout=${logout}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setSub?setSetSub(null):setView({tab:'me'}))}<span className="top-title">${setSub?titles[setSub]:'Settings'}</span></div></div>`;
  } else if(view.tab==='shop'||view.tab==='plus'){
    body=view.tab==='shop'?html`<${ShopView} s=${s} dispatch=${dispatch} open=${open}/>`:html`<${PlusView} s=${s} dispatch=${dispatch}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'me'}))}<span className="top-title">${view.tab==='shop'?'Fire Sale':'Temp+'}</span></div></div>`;
  } else if(view.tab==='live'){
    body=html`<${LiveView} me=${myId}/>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'home'}))}<span className="top-title">Live Takes</span></div></div>`;
  } else if(view.tab==='post'){
    const p=s.posts.find(x=>x.id===view.postId);
    body=p&&visible(s,p)?html`<div className="feed"><${Post} key=${p.id} p=${p} s=${s} dispatch=${dispatch} open=${open}/></div>`:html`<div className="empty">This take has burned away.</div>`;
    top=html`<div className="top"><div className="top-row">${backBtn(()=>setView({tab:'activity'}))}<span className="top-title">Take</span></div></div>`;
  } else if(view.tab==='replay'){
    body=html`<${Replay} s=${s} dispatch=${dispatch} open=${open} startId=${view.reelId}/>`;
  } else {
    const id=view.tab==='me'?'me':view.profileId;
    body=html`<${Profile} key=${id+(view.ptab||'')} s=${s} id=${id} dispatch=${dispatch} open=${open} startTab=${view.ptab} back=${view.tab==='profile'?()=>setView({tab:'home'}):null}/>`;
  }
  const isReplay=view.tab==='replay';

  return html`<div className="app">
    <${BarsOnScroll} on=${view.tab==='home'}/>
    ${top}
    ${body}

    ${view.tab==='home'&&html`<button className=${'gl-peek'+(peek?' show':'')} onClick=${()=>{setPeek(false);setSide(true)}} aria-label="Open Go Live"><b>GO LIVE</b></button>`}
    <div className=${'gl-side'+(side?' open':'')} aria-hidden=${!side} onTouchStart=${e=>{const t=e.touches[0];window.__gls={x:t.clientX,y:t.clientY}}} onTouchEnd=${e=>{const a=window.__gls;if(!a)return;const t=e.changedTouches[0];if(t.clientX-a.x<-80&&Math.abs(t.clientX-a.x)>Math.abs(t.clientY-a.y)*1.5)setSide(false)}}>${side&&html`<${GoLivePage} key=${sideWatch||'lobby'} me=${myId} startWatch=${sideWatch} onClose=${()=>{setSide(false);setSideWatch(null)}}/>`}</div>
    <nav className=${'nav'+(isReplay?' dark':'')} aria-label="Main"><div className="nav-in">
      <button aria-label="Home" aria-current=${view.tab==='home'?'page':null} onClick=${guard(()=>setView({tab:'home'}))}><${Icon} n="home" s=${25}/></button>
      <button aria-label="Search" data-tour="nav-search" aria-current=${view.tab==='search'?'page':null} onClick=${guard(()=>setView({tab:'search'}))}><${Icon} n="search" s=${25}/></button>
      <button className="create" aria-label="New post" data-tour="nav-create" onClick=${guard(()=>setSheet({kind:'compose',reel:isReplay}))}><${Icon} n="plus" s=${26} w=${2.6}/></button>
      <button aria-label="Replay" data-tour="nav-replay" aria-current=${isReplay?'page':null} onClick=${guard(()=>setView({tab:'replay'}))}><${Icon} n="reels" s=${25}/></button>
      <button aria-label="Profile" data-tour="nav-me" aria-current=${['me','settings','shop','plus'].includes(view.tab)?'page':null} onClick=${guard(()=>setView({tab:'me'}))}><${Avatar} u=${s.users.me} size=${28}/></button>
    </div></nav>

    <input ref=${storyFile} type="file" accept="image/*,video/*" className="vh" id="story-file"
      onChange=${e=>{const f=e.target.files[0];if(f){const r=readFile(f);setStoryDraft({url:r.url,type:r.type,file:f})}e.target.value=''}}/>
    ${storyDraft&&html`<${StoryDraft} draft=${storyDraft} onClose=${()=>setStoryDraft(null)} onPost=${(cap,layout)=>{dispatch({type:'story',url:storyDraft.url,mtype:storyDraft.type,file:storyDraft.file,caption:cap,layout});setStoryDraft(null)}}/>`}
    ${sheet&&sheet.kind==='compose'&&html`<${Composer} s=${s} dispatch=${dispatch} onClose=${close} startReel=${sheet.reel} open=${open}/>`}
    ${sheet&&sheet.kind==='record'&&html`<${Recorder} s=${s} dispatch=${dispatch} onClose=${close} open=${open} startMode=${sheet.mode} onStory=${d=>{close();setStoryDraft(d)}}/>`}
    ${sheet&&sheet.kind==='comments'&&sheetPost&&html`<${Comments} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close} open=${open}/>`}
    ${sheet&&sheet.kind==='share'&&sheetPost&&html`<${Share} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close}/>`}
    ${sheet&&sheet.kind==='menu'&&sheetPost&&html`<${PostMenu} p=${sheetPost} s=${s} dispatch=${dispatch} onClose=${close} open=${open}/>`}
    ${sheet&&sheet.kind==='edit'&&html`<${EditProfile} s=${s} dispatch=${dispatch} onClose=${close}/>`}
    ${storyUser&&html`<${StoryViewer} s=${s} startUser=${storyUser} dispatch=${dispatch} onClose=${()=>setStoryUser(null)} onAdd=${()=>{setStoryUser(null);setSheet({kind:'record',mode:'story'})}}/>`}
    ${breakOpen&&html`<div className="modal" role="dialog" aria-label="Take a break"><div className="modal-card">
      <span className="orb" style=${{width:64,height:64}}><span className="av" style=${{width:'100%',height:'100%',background:'var(--card)',borderRadius:'inherit',border:0}}><${Icon} n="clock" s=${26}/></span></span>
      <h3>Time for a break?</h3><p className="sub" style=${{margin:0}}>You’ve been scrolling for ${s.settings.breakMins} minutes.</p>
      <button className="btn orange wide" onClick=${()=>setBreakOpen(false)}>Got it</button>
      <button className="t-skip" onClick=${()=>{dispatch({type:'set',key:'breakMins',value:0});setBreakOpen(false)}}>Turn off reminders</button></div></div>`}
    ${tour!==null&&html`<${Tour} s=${s} ids=${tourIds} step=${tour} setStep=${setTour} onEnd=${endTour}/>`}
    ${s.toast&&tour===null&&html`<div className=${'toast'+(s.toast.sticky?' sticky':'')} key=${s.toast.at} role="status">${s.toast.sticky?html`<span className="t-spin" aria-hidden="true"></span>`:null}${s.toast.msg}</div>`}
  </div>`;
}

// Home Screen app support (works offline with the last loaded version)
if('serviceWorker' in navigator&&!EMBED&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(EMBED?(EMBED_KIND==='golive'?html`<${GoLiveEmbed}/>`:html`<${LiveEmbed}/>`):html`<${App}/><${Intro}/>`);
</script>

</body>
</html>
